  reading:{
    title:'The Structure of Academic Essays',
    words: 360,
    minutes: 5,
    text:`Academic essays are a fundamental form of communication in higher education. They allow students to demonstrate their understanding of a topic, engage with existing research, and contribute their own ideas. However, writing a strong academic essay requires more than just good ideas; it requires a clear and logical structure.

Most academic essays follow a standard structure: introduction, body paragraphs, and conclusion. The introduction presents the topic, provides context, and states the thesis—the main argument of the essay. The thesis is often the most important sentence in the essay, as it guides the reader through the rest of the argument.

The body paragraphs develop the argument. Each paragraph should focus on a single main idea, which is usually stated in a topic sentence. The topic sentence is then supported by evidence: examples, statistics, quotations from experts, or logical reasoning. It is crucial to cite sources properly and to integrate evidence smoothly into the argument.

Different disciplines have different conventions for structuring arguments. In the humanities, essays often follow a thesis-driven structure, where the argument unfolds through a series of carefully reasoned points. In the social sciences, essays often follow an empirical structure, starting with a research question, then presenting data, and finally discussing the implications. In the natural sciences, essays often follow the structure of a scientific paper: introduction, methods, results, and discussion.

Regardless of the discipline, certain principles apply. Clarity is essential. The writer should avoid jargon and ambiguous language. Coherence is also crucial. Each paragraph should connect logically to the next, and the argument as a whole should be coherent. Finally, originality is valued. While students must engage with existing research, they should also contribute their own insights and perspectives.

In the end, the structure of an academic essay is not just a set of rules; it is a tool for clear thinking. By organizing ideas logically, the writer helps the reader understand and evaluate the argument.`,

  reading:{
    title:'How to Evaluate Arguments',
    words: 360,
    minutes: 5,
    text:`Critical thinking is the ability to analyze information objectively and make reasoned judgments. It is an essential skill in academic, professional, and personal life. At its core, critical thinking involves evaluating arguments—assessing whether they are valid, sound, and persuasive.

An argument consists of premises and a conclusion. The premises are the reasons or evidence offered in support of the conclusion. The conclusion is the claim being made. A good argument is one in which the premises genuinely support the conclusion.

There are two main types of arguments: deductive and inductive. In a deductive argument, if the premises are true, the conclusion must be true. For example: "All humans are mortal. Socrates is human. Therefore, Socrates is mortal." This argument is valid because the conclusion follows necessarily from the premises. In an inductive argument, the premises make the conclusion probable but not certain. For example: "The sun has risen every day for millions of years. Therefore, the sun will rise tomorrow." This argument is strong but not absolutely certain.

Evaluating arguments requires identifying both the explicit and implicit premises. Often, arguments rely on unstated assumptions that must be examined. For example, the argument "We should ban fast food advertising because it encourages unhealthy eating" relies on the assumption that advertising significantly influences eating behavior. Is this assumption justified? That is the kind of question a critical thinker must ask.

Another key aspect of critical thinking is recognizing fallacies—errors in reasoning that undermine the validity of an argument. Common fallacies include ad hominem attacks (attacking the person rather than the argument), straw man arguments (misrepresenting the opponent's position), and false dilemmas (presenting only two options when more exist).

Critical thinking also involves considering alternative perspectives. A strong argument anticipates and addresses counterarguments. It acknowledges complexity and avoids oversimplification.

In the end, critical thinking is not about being negative or skeptical of everything. It is about being thoughtful, fair, and rigorous in evaluating information. It is a skill that can be learned and improved with practice.`,

    title:'Effective Email Writing',

    minutes: 5,
    text:`Email has become the primary form of communication in the professional world. Every day, millions of emails are sent and received, connecting colleagues, clients, and partners across the globe. However, not all emails are effective. A poorly written email can waste time, damage relationships, and undermine your professional reputation.

Effective email writing requires clarity, conciseness, and professionalism. The first step is to define the purpose of your email. What do you want the recipient to do after reading it? The answer to this question should guide every aspect of your email, from the subject line to the closing.

The subject line is critical. It should be concise, informative, and specific. A vague subject line like "Question" or "Update" is likely to be ignored or delayed. A specific subject line like "Action Required: Budget Approval by Friday" tells the recipient exactly what to expect and what action is required.

The opening of the email should be appropriate to the context and relationship. In formal contexts, use a formal greeting such as "Dear Mr. Smith" or "Dear Hiring Manager." In less formal contexts, a friendly greeting like "Hi Sarah" or "Hello team" is acceptable.

The body of the email should be clear and well-organized. Use short paragraphs, bullet points, and bold text to make your message easy to scan. State your main point early on, and provide context or details as needed. Be respectful and professional in tone, even when addressing problems or disagreements.

The closing should be clear and polite. Include a call to action if necessary, and end with a standard closing such as "Best regards," "Sincerely," or "Thank you." Finally, proofread your email before sending. Check for typos, grammar errors, and clarity. A single error can make a poor impression.

In the end, effective email writing is a skill that can be learned and improved with practice. By following these principles, you can communicate more effectively and build stronger professional relationships.`,

  reading:{
    title:'Cultural Intelligence in the Global Workplace',
    words: 370,
    minutes: 5,
    text:`In today's globalized world, working with people from different cultural backgrounds is no longer the exception—it is the norm. Multinational companies operate across borders, teams are distributed across continents, and cross-cultural collaboration is a daily reality. In this context, cultural intelligence (CQ) has become an essential skill for professionals.

Cultural intelligence is the ability to relate and work effectively across cultures. Unlike IQ or emotional intelligence, CQ is specifically focused on intercultural interactions. It has been described as having four dimensions: drive, knowledge, strategy, and action.

Drive refers to the motivation to engage with people from different cultures. It includes curiosity, confidence, and a genuine interest in learning about others. Without drive, even the most knowledgeable person may struggle in intercultural situations.

Knowledge refers to understanding how cultures differ. This includes knowledge of cultural values, norms, and practices. For example, some cultures value direct communication, while others value indirect communication. Some cultures emphasize individualism, while others emphasize collectivism. Understanding these differences helps us anticipate and interpret behavior.

Strategy refers to the ability to plan for intercultural interactions. This involves thinking about how to approach a situation, what to expect, and how to respond. It also involves being aware of our own cultural biases and assumptions.

Action refers to the ability to adapt our behavior in real-time. This is perhaps the most challenging dimension, as it requires flexibility, empathy, and self-regulation. A person with high CQ can modify their communication style, adjust their expectations, and respond appropriately to unexpected situations.

Developing cultural intelligence is a lifelong process. It requires continuous learning, reflection, and practice. It also requires humility—the recognition that we do not know everything and that we can always learn from others.

In the end, cultural intelligence is not just a professional skill. It is a human skill—one that helps us build bridges, foster understanding, and collaborate more effectively in an increasingly interconnected world.`,

  title:'The Art of Literary Criticism',

  minutes: 6,
  text:`Literary criticism is the practice of interpreting and evaluating works of literature. It is not simply a matter of personal taste; rather, it is a rigorous intellectual discipline that draws on various theoretical frameworks to illuminate texts in new and meaningful ways.

One of the most influential approaches to literary criticism is formalism, which focuses on the formal elements of a text—its structure, language, imagery, and symbolism—rather than on its biographical or historical context. Formalist critics argue that a literary work should be analyzed as a self-contained artifact, whose meaning is generated by the relationships between its parts.

Another major approach is historicism, which situates a text within its historical and cultural context. Historicist critics examine the social, political, and economic conditions in which a work was produced, and they consider how these conditions shape its meaning. They may also explore how a text reflects or challenges the dominant ideologies of its time.

Reader-response criticism shifts the focus from the text itself to the reader's experience. According to this approach, meaning is not inherent in the text but is created through the interaction between the text and the reader. Different readers, with different backgrounds and expectations, may interpret the same text in different ways.

Psychoanalytic criticism draws on the theories of Sigmund Freud and Jacques Lacan to explore the unconscious dimensions of literary works. Critics in this tradition may analyze characters' motivations, the symbolism of dreams, or the ways in which texts repress or reveal forbidden desires.

Feminist criticism examines how literature reflects and reinforces, or challenges, patriarchal structures. Feminist critics may explore the representation of women in literary texts, the ways in which gender shapes authorship and reception, or the possibilities for a distinctively feminine literary tradition.

Postcolonial criticism focuses on the literature produced by colonized peoples and on the ways in which colonial power relations continue to shape cultural production. Postcolonial critics may examine how texts resist or subvert colonial narratives, or how they negotiate the complexities of identity in a postcolonial world.

In the end, literary criticism is not about finding the "correct" interpretation of a text. It is about generating rich, nuanced, and illuminating readings that deepen our understanding of literature and of the human experience.`,

  text:`Diplomacy is the practice of conducting negotiations and managing relationships between nations or other political entities. It is one of the oldest and most sophisticated forms of human interaction, requiring a unique combination of tact, intelligence, and emotional control.

    reading:{
  title:'The Power of Rhetoric',
  words: 380,
  minutes: 6,
  text:`Rhetoric is the art of using language effectively and persuasively. It has been studied and practiced since ancient Greece, where philosophers like Aristotle and Cicero developed theories about how language can be used to influence audiences.

Aristotle identified three main modes of persuasion: ethos, pathos, and logos. Ethos refers to the credibility of the speaker—the audience must trust and respect the person making the argument. Pathos refers to emotional appeal—the speaker must evoke feelings that support the argument. Logos refers to logical appeal—the argument must be based on reason and evidence.

These three modes of persuasion remain fundamental to rhetoric today. A successful speech or written argument typically combines all three, using credibility to establish trust, emotion to engage the audience, and logic to make a compelling case.

Rhetoric is not limited to formal speeches or political discourse. It is present in everyday communication—in advertisements, in conversations, in social media posts. Whenever we try to persuade someone to see things our way, we are using rhetoric.

However, rhetoric has a dark side. It can be used to manipulate and deceive, as well as to inform and persuade. Demagogues and propagandists have long used rhetorical techniques to stir up emotions, spread misinformation, and consolidate power.

This is why it is important to be able to recognize and analyze rhetorical techniques. By understanding how rhetoric works, we can become more critical consumers of information, better equipped to identify manipulation and resist it.

One common rhetorical technique is the use of repetition. Repeating a phrase or idea can make it seem more true or more important than it actually is. Another is the use of false dilemmas—presenting only two options when more exist. A third is the use of ad hominem attacks—attacking the person making the argument rather than the argument itself.

In the end, rhetoric is a tool. Like any tool, it can be used for good or for ill. The key is to use it responsibly and to be aware of how it is being used by others.`,

  reading:{
    title:'The Nature of Knowledge',
    words: 380,
    minutes: 6,
    text:`Epistemology is the branch of philosophy concerned with the nature, scope, and limits of knowledge. It asks fundamental questions: What is knowledge? How do we acquire it? What can we know for certain? These questions have preoccupied philosophers for millennia, and they remain as relevant today as they were in ancient Greece.

The classical definition of knowledge, dating back to Plato, is that knowledge is justified true belief (JTB). According to this account, for someone to know something, three conditions must be met: the belief must be true, the person must be justified in holding it, and the person must believe it. However, in 1963, the philosopher Edmund Gettier published a series of counterexamples demonstrating that JTB is not sufficient for knowledge. In Gettier cases, a person has a justified true belief that nonetheless does not count as knowledge because the justification is, in some sense, accidental.

Responses to the Gettier problem have been varied. Some philosophers have argued that knowledge requires a fourth condition, such as a causal connection between the belief and the fact, or the absence of defeaters. Others have proposed that knowledge should be understood in terms of intellectual virtues—character traits such as open-mindedness, intellectual courage, and careful reasoning.

A central debate in epistemology concerns the sources of knowledge. Empiricists argue that all knowledge comes from experience, while rationalists maintain that some knowledge is innate or derived from reason alone. Kant attempted to reconcile these positions by arguing that knowledge arises from the interaction between sensory experience and the structures of the mind.

Another key debate concerns skepticism—the view that knowledge is impossible or that we cannot be certain of anything. Skeptics challenge our claims to knowledge by pointing out that our senses can deceive us, that we may be dreaming, or that an evil demon could be manipulating our perceptions. Responses to skepticism have ranged from Cartesian foundationalism, which seeks indubitable foundations for knowledge, to pragmatic accounts that focus on the practical consequences of belief.

In the end, epistemology is not just an abstract intellectual exercise. It has profound implications for science, ethics, politics, and everyday life. Understanding what we can know, and how we can know it, is essential for making informed decisions and for living a reflective life.`,

  reading:{
    title:'The Language of Science',

    minutes: 6,
    text:`Scientific language is a specialized form of communication used to describe, explain, and predict natural phenomena. It is characterized by precision, objectivity, and a reliance on evidence. However, scientific language is not merely a neutral tool for conveying facts; it shapes how we understand the world and how we communicate that understanding.

One of the defining features of scientific language is its use of technical terminology. Terms like "photosynthesis," "entropy," and "neuroplasticity" allow scientists to refer to complex concepts with a single word. This precision is essential for efficient communication within the scientific community. However, technical language can also create barriers between scientists and the general public.

The tension between precision and accessibility is a central challenge of scientific writing. On the one hand, scientists must be precise to avoid ambiguity and to ensure that their findings can be replicated. On the other hand, they must be accessible to be understood by non-specialists, policymakers, and the public. Striking the right balance is an art as much as a science.

Another key feature of scientific language is its reliance on hedging. Scientists often use qualifying language—"may," "suggests," "appears to"—to indicate the limits of their knowledge and the provisional nature of scientific findings. This hedging is not a sign of weakness but of intellectual honesty.

Scientific language also reflects the values of the scientific community. Objectivity, skepticism, and openness to revision are embedded in the language itself. Scientists are expected to describe their methods and results in enough detail that others can evaluate and reproduce their work.

In recent years, there has been a growing movement to make science more accessible. Initiatives like open-access publishing, science journalism, and public engagement events aim to bridge the gap between scientists and the public. These efforts recognize that science is not just for scientists; it is a shared human endeavor that benefits from broad participation and understanding.

In the end, scientific language is a powerful tool. It enables us to describe the universe with unprecedented precision and to communicate complex ideas across time and space. But it must be used responsibly, with attention to both rigor and accessibility.`,

// Fisher-Yates shuffle — baraja un array sin mutar el original
const shuffle = a => {
  const arr = [...a];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

/**
 * Alterna entre type="password" y type="text" en un input de contraseña.
 * Cambia también el ícono del botón (ojo abierto / ojo cerrado).
 */
function togglePasswordVisibility(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;

  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';

  // Actualizar ícono
  if(isPassword){
    // Ahora se ve la contraseña → mostrar ojo cerrado
    btn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>`;
    btn.setAttribute('aria-label','Ocultar contraseña');
  } else {
    // Ahora está oculta → mostrar ojo abierto
    btn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>`;
    btn.setAttribute('aria-label','Mostrar contraseña');
  }

  // Mantener el foco en el input después del cambio
  input.focus();
  // Mover el cursor al final
  const val = input.value;
  input.setSelectionRange(val.length, val.length);
}

  if(!user && !publicViews.includes(UI.view)) UI.view = 'landing';
  
  if(UI.view === 'landing')        app.innerHTML = await renderLanding();
  else if(UI.view === 'dashboard') app.innerHTML = await renderDashboard(user);
  else if(UI.view === 'course')    app.innerHTML = await renderCourse(user);
  else if(UI.view === 'pricing')   app.innerHTML = await renderPricing(user);

  else if(UI.view === 'teacher')   app.innerHTML = await renderTeacher(user);
  else if(UI.view === 'account')   app.innerHTML = await renderAccount(user); 
  else if(UI.view === 'forgot-password') app.innerHTML = await renderForgotPassword();
  else if(UI.view === 'reset-password')  app.innerHTML = await renderResetPassword();

  // Post-render: inyectar pricing cards donde exista #pricing

  // Ajuste responsive de la vista de curso
  document.body.classList.toggle('view-course', UI.view === 'course');

  // ─── Tooltip automático (primera vez por sesión) ───
  if(!sessionStorage.getItem('wa_tip_shown')){
    setTimeout(() => {
      float.classList.add('show-tip');
      setTimeout(() => {
        float.classList.remove('show-tip');
        sessionStorage.setItem('wa_tip_shown', '1');
      }, 4000);
    }, 2500);
  }

  // ─── Tooltip personalizado si hay usuario ───
  const tooltip = document.getElementById('waTooltip');
  if(tooltip){
    try {
      const user = await store.getUser();
      tooltip.textContent = user
        ? `¿Te ayudo, ${user.name.split(' ')[0]}? 💬`
        : '¿Necesitas ayuda? 💬';
    } catch(e) {
      tooltip.textContent = '¿Necesitas ayuda? 💬';
    }
  }
}

(async function handleAuthCallback(){
  // Si la URL tiene un hash con access_token (venimos del email)
  if(window.location.hash.includes('access_token')){
    // Esperar un momento a que Supabase procese el token del hash
    await new Promise(r => setTimeout(r, 500));
    
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    
    if(session){
      toast('¡Email confirmado! Bienvenido.', 'ok');
      // Limpiar el hash de la URL (para que no quede feo)
      history.replaceState(null, '', window.location.pathname);
      UI.view = 'dashboard';
      render();
    } else if(error){
      toast('Error al confirmar: ' + error.message, 'err');
      history.replaceState(null, '', window.location.pathname);
      render();
    }
  }
})();

function makeCloze(d){
  const items = [];
  const candidates = d.lines.filter(l => l.t.split(' ').length >= 6);
  shuffle(candidates).slice(0,5).forEach(l => {
    const words = l.t.split(' ');
    const opts = words.map((w,idx)=>({w,idx})).filter(o => o.idx>0 && o.w.replace(/[^A-Za-z']/g,'').length>=5);
    if(!opts.length) return;
    const pick = opts[Math.floor(Math.random()*opts.length)];
    items.push({
      speaker:l.s,
      before:words.slice(0,pick.idx).join(' '),
      after:words.slice(pick.idx+1).join(' '),
      answer:pick.w.replace(/[^A-Za-z']/g,''),
      full:l.t
    });
  });
  return items;
}

//--------------------------------bindAuth
function bindAuth(){
  const alertEl = $('#authAlert');
  const showAlert = (msg, type='err') => {
    alertEl.className = `alert ${type} show`;
    alertEl.textContent = msg;
  };

  const loginForm = $('#loginForm');
  if(loginForm) loginForm.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(loginForm);
    try {
      await store.signIn(fd.get('email'), fd.get('password'));
      $('#authModal').classList.remove('show');
      toast('¡Bienvenido!', 'ok');
      UI.view = 'dashboard';
      render();
    } catch(err){ showAlert(err.message); }
  };
  //----------------------registerForm
  const registerForm = $('#registerForm');
  if(registerForm){
    // Cargar docentes y conectar el toggle de rol
    loadTeachersIntoSelect();

    // Toggle de rol → mostrar/ocultar el selector de docente
    const toggleTeacherField = () => {
      const role = registerForm.querySelector('input[name="role"]:checked')?.value || 'student';
      const field = $('#teacherSelectField');
      if(field) field.style.display = role === 'student' ? 'block' : 'none';
    };
    registerForm.querySelectorAll('input[name="role"]').forEach(r => {
      r.onchange = toggleTeacherField;
    });
    toggleTeacherField();

    registerForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(registerForm);
      const role = fd.get('role') || 'student';
      const teacherId = role === 'student' ? (fd.get('teacher_id') || null) : null;

      try {
        const { needsConfirmation } = await store.signUp({
          name: fd.get('name').trim(),
          email: fd.get('email').trim(),
          password: fd.get('password'),
          role,
          teacherId
        });
        $('#authModal').classList.remove('show');
        if(needsConfirmation){
          toast('Revisa tu email para confirmar la cuenta.', 'ok');
        } else {
          toast('¡Cuenta creada!', 'ok');
          UI.view = 'dashboard';
        }
        render();
      } catch(err){ showAlert(err.message); }
    };
  }//end registerForm

  $$('#authModal [data-auth]').forEach(el => {
    el.onclick = () => openAuth(el.dataset.auth);
  });

  // Formulario de recuperación de contraseña
const forgotForm = $('#forgotForm');

   ============================================================ */
let voiceCache = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  if(voiceCache) return voiceCache;
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if(!vs.length) return null;
  voiceCache = vs.find(v=>/en-US/i.test(v.lang) && /female|samantha|zira|aria|jenny/i.test(v.name))
           || vs.find(v=>/en-US/i.test(v.lang)) || vs[0];
  return voiceCache;
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = ()=>{ voiceCache=null; pickVoice(); }; }

function speak(text, btn){
  if(!('speechSynthesis' in window)){ toast('Tu navegador no soporta voz.', 'err'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.9;
  const v = pickVoice(); if(v) u.voice = v;
  if(btn){ btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
  speechSynthesis.speak(u);
}
function speakAll(){
  const d = getDialogue(UI.currentDialogue); if(!d) return;
  if(!('speechSynthesis' in window)){ toast('Tu navegador no soporta voz.', 'err'); return; }
  speechSynthesis.cancel();
  d.lines.forEach((line,i) => {
    const u = new SpeechSynthesisUtterance(line.t);
    u.lang='en-US'; u.rate=0.88;
    const v = pickVoice(); if(v) u.voice = v;
    u.onstart = () => {
      $$('.line').forEach(el => el.classList.remove('speaking'));
      const el = document.querySelector(`.line[data-i="${i}"]`);
      if(el){ el.classList.add('speaking'); el.scrollIntoView({block:'center',behavior:'smooth'}); }
    };
    u.onend = () => { if(i===d.lines.length-1) $$('.line').forEach(el=>el.classList.remove('speaking')); };
    speechSynthesis.speak(u);
  });
}

/* Cloze check */
async function checkCloze(){
  const items = UI.cloze; if(!items) return;
  UI.clozeAttempts = UI.clozeAttempts || {};

  // Verificar el input que tiene el foco, o el primero no deshabilitado
  const input = document.activeElement?.matches?.('.cloze-txt input')
              ? document.activeElement
              : document.querySelector('.cloze-txt input:not([disabled])');

  if(!input) return;

  const i = +input.dataset.i;
  const val = input.value.trim().toLowerCase().replace(/[^a-z']/g,'');
  const ans = items[i].answer.toLowerCase();
  const fb = document.getElementById('fb'+i);
  const attemptsEl = document.getElementById('attempts'+i);

  // Incrementar intentos de este ejercicio
  UI.clozeAttempts[i] = (UI.clozeAttempts[i] || 0) + 1;
  if(attemptsEl) attemptsEl.textContent = UI.clozeAttempts[i];

  if(val === ans){
    // ✅ Acertó
    const points = UI.clozeAttempts[i] === 1 ? 1 : 0.5;
    input.classList.remove('bad');
    input.classList.add('ok');
    input.disabled = true;
    fb.className = 'fb ok show';
    fb.textContent = UI.clozeAttempts[i] === 1
      ? '✓ Correcto al primer intento (+1 punto)'
      : '✓ Correcto al segundo intento (+0.5 puntos)';

    // Enfocar el siguiente input automáticamente
    const next = document.querySelector(`.cloze-txt input[data-i="${i+1}"]:not([disabled])`);
    if(next) setTimeout(() => next.focus(), 150);

  } else if(UI.clozeAttempts[i] >= 2){
    // ❌ Agotó los 2 intentos
    input.classList.remove('bad');
    input.classList.add('bad');
    input.disabled = true;
    input.value = items[i].answer;
    fb.className = 'fb bad show';
    fb.textContent = `✗ Sin intentos. Respuesta: "${items[i].answer}"`;

    // Enfocar el siguiente
    const next = document.querySelector(`.cloze-txt input[data-i="${i+1}"]:not([disabled])`);
    if(next) setTimeout(() => next.focus(), 150);

  } else {
    // ❌ Falló el primer intento, quedan oportunidades
    input.classList.remove('ok');
    input.classList.add('bad');
    fb.className = 'fb bad show';
    fb.textContent = '✗ Incorrecto. Te queda 1 intento.';
    input.select();
    return;   // no continuar al resumen
  }

  // Verificar si todos los ejercicios están resueltos
  const allDone = items.every((_, idx) => {
    const inp = document.querySelector(`.cloze-txt input[data-i="${idx}"]`);
    return inp && inp.disabled;
  });

  if(allDone && !UI.clozeFinished){
    UI.clozeFinished = true;

    // Calcular puntuación total
    let total = 0;
    items.forEach((_, idx) => {
      const inp = document.querySelector(`.cloze-txt input[data-i="${idx}"]`);
      if(inp.classList.contains('ok')){
        total += (UI.clozeAttempts[idx] === 1 ? 1 : 0.5);
      }
    });

    const pct = Math.round((total / items.length) * 100);
    const scoreEl = document.getElementById('clozeScore');
    scoreEl.textContent = `Resultado: ${total} / ${items.length} (${pct}%) ${pct === 100 ? '🎉' : ''}`;

    // Guardar en Supabase (sumando al score existente)
    try {
      const user = await store.getUser();
      const dialogueId = UI.currentDialogue;
      if(user && dialogueId){
        const prog = await store.getProgress(user.id);
        const existing = prog.quizScores.find(q => q.dialogueId === dialogueId);
        const newScore = (existing?.score || 0) + total;
        const newTotal = (existing?.total || 0) + items.length;
        await store.saveQuizScore(user.id, dialogueId, newScore, newTotal);
        UI.clozeSavedPoints = total;
        console.log('[Cloze] Guardado:', newScore, '/', newTotal);
        toast('Puntuación guardada', 'ok');
      }
    } catch(err){
      console.error('[Cloze] Error:', err);
      toast('Error guardando la puntuación', 'err');
    }
  }
}
  
/* Quiz */
function startQuiz(phrases){
  const all = DIALOGUES.flatMap(d => d.phrases);
  const questions = shuffle(phrases).slice(0, Math.min(5, phrases.length)).map(p => {
    const distractors = shuffle(all.filter(x => x.es !== p.es)).slice(0,3).map(x => x.es);
    return { q: p.en, options: shuffle([p.es, ...distractors]), answer: p.es };
  });
  UI.quiz = { questions, index:0, score:0, answered:false };
  render();
}
// startReadingQuiz
  function startReadingQuiz(questions){
  // Las preguntas ya vienen con formato {q, es, options, answer}
  const formatted = shuffle(questions).map(q => ({
    q: q.q,
    sub: q.es || 'Elige la respuesta correcta',
    options: q.options,
    answer: q.answer
  }));
  UI.quiz = { 
    questions: formatted, 
    index: 0, 
    score: 0, 
    answered: false,
    isReading: true   // flag para distinguir el tipo de quiz
  };
  render();
}
  
async function answerQuiz(btn){
  const z = UI.quiz; if(z.answered) return;
  z.answered = true;
  const q = z.questions[z.index];
  const chosen = q.options[+btn.dataset.i];
  const correct = chosen === q.answer;
  if(correct) z.score++;

  // Marcar visualmente
  $$('.opt').forEach((b,i) => {
    b.disabled = true;
    if(q.options[i] === q.answer){ b.classList.add('correct'); b.querySelector('.mark').textContent='✓'; }
    else if(b===btn){ b.classList.add('wrong'); b.querySelector('.mark').textContent='✗'; }
  });
  const next = $('#btnNextQ');
  if(next){
    next.style.display='inline-block';
    next.textContent = z.index === z.questions.length-1 ? 'Ver resultado →' : 'Siguiente →';
  }

  // ⬇️ NUEVO: si este era el último quiz, guardar el score
  if(z.index === z.questions.length - 1 && !z.saved){
    z.saved = true;
    try {
      const user = await store.getUser();
      const dialogueId = UI.currentDialogue;
      if(user && dialogueId){
        await store.saveQuizScore(user.id, dialogueId, z.score, z.questions.length);
        console.log('[Quiz] Score guardado:', z.score, '/', z.questions.length);
      }
    } catch(err){
      console.error('[Quiz] Error guardando score:', err);
    }
  }
}

(async function init(){
  // Detectar retorno desde email de recuperación
const params = new URLSearchParams(window.location.search);

  // Detectar retorno desde Stripe Checkout
const paymentStatus = params.get('payment');
if(paymentStatus === 'success'){
  const levelId = params.get('level');
  const level = levelId ? getLevel(levelId) : null;
  
  // Limpiar la URL
  history.replaceState(null, '', window.location.pathname);
  
  // Refrescar el perfil (invalidar caché para que traiga los datos nuevos de Supabase)
  store._profile = null;
  
  // Esperar un momento a que Supabase y el webhook terminen
  setTimeout(async () => {
    const user = await store.getUser();
    if(user){
      UI.view = 'dashboard';
      render();
      toast(`¡Pago exitoso! Nivel ${level?.code || ''} desbloqueado 🎉`, 'ok');
    } else {
      UI.view = 'landing';
      render();
    }
  }, 1500);
  
  return;   // no seguir con el render normal
}

if(paymentStatus === 'cancelled'){
  history.replaceState(null, '', window.location.pathname);
  setTimeout(() => {
    toast('Pago cancelado. Puedes intentarlo de nuevo cuando quieras.', 'err');
    UI.view = 'landing';
    render();
  }, 500);
  return;
}
  
const hashParams = new URLSearchParams(window.location.hash.substring(1));
const isRecovery = params.get('mode') === 'reset-password'
  || hashParams.get('type') === 'recovery'
  || params.get('type') === 'recovery';

if(isRecovery){
   // Bandera persistente que sobrevive recargas y cambios de pestaña
  localStorage.setItem('pending_password_reset', 'true');
  
   // Procesar el token de Supabase manualmente
  // (el hash contiene access_token y refresh_token)
  const accessToken = hashParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token');

  if(accessToken && refreshToken){
    try {
      // Crear la sesión manualmente
      await supabaseClient.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
    } catch(err){
      console.warn('[Recovery] Error al establecer sesión:', err);
    }
  }
  
  //limpiar la url
  history.replaceState(null, '', window.location.pathname);
  
  // Forzar el render de la vista de reset aunque haya sesión  
  UI.view = 'reset-password';
  UI._isRecoveryMode = true;
  $('#app').innerHTML = await renderResetPassword();
  setTimeout(() => bindAuth(), 0);
  return;
}

  // Si hay una recuperación pendiente, forzar la vista de reset
  if(localStorage.getItem('pending_password_reset') === 'true'){
    UI.view = 'reset-password';
    UI._isRecoveryMode = true;
    await new Promise(r => setTimeout(r, 100));  // dejar que Supabase procese el token
    $('#app').innerHTML = await renderResetPassword();
    setTimeout(() => bindAuth(), 0);
    return;
  }
  
  // Escuchar cambios de sesión
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
     // Si hay una recuperación pendiente, siempre mostrar el reset
    if(event === 'PASSWORD_RECOVERY'){
        localStorage.getItem('pending_password_reset','true');
        UI.view = 'reset-password';
        UI._isRecoveryMode = true;
        $('#app').innerHTML = await renderResetPassword();
        setTimeout(() => bindAuth(), 0);
        return;
     }
    
    if(event === 'SIGNED_OUT'){
      store._session = null;
      store._profile = null;
      UI.view = 'landing';
      render();
    }
    
    if(event === 'USER_UPDATED'){
    // El usuario cambió su contraseña en otra pestaña
    // Cerrar esta sesión también
    if(!UI._isRecoveryMode){
      await store.signOut();
      toast('Tu contraseña cambió en otro dispositivo. Inicia sesión de nuevo.', 'ok');
      UI.view = 'landing';
      render();
    }
  }
});

  // En tu init(), después de onAuthStateChange pero ANTES de render()
if(localStorage.getItem('pending_password_reset') === 'true'){
  // Ya manejado arriba, no ejecutar render() normal
  return;
}

// Solo si NO hay recuperación pendiente
//render();
    
  const localUser = await store.getUser();
  if(localUser){       
    const { data: { user: serverUser }, error } = await supabaseClient.auth.getUser();

   if(error || !serverUser){
    // El localStorage dice que hay sesión, pero el servidor la rechazó
    await store.signOut();
    UI.view = 'landing';
    render();
    return;
   }    
    UI.view = 'dashboard';
  }
  
   document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible' && !UI._isRecoveryMode){
    const { data: { user }, error } = await supabaseClient.auth.getUser();
    if(error || !user){
      await store.signOut();
      UI.view = 'landing';
      render();
    }
  }
});
    
  // Observer para detectar cuándo se abren/cierran modales
  const modalObserver = new MutationObserver(() => {
  const anyOpen = document.querySelector('.modal-backdrop.show');
  document.body.classList.toggle('modal-open', !!anyOpen);
});

  document.querySelectorAll('.modal-backdrop').forEach(m => {
  modalObserver.observe(m, { attributes: true, attributeFilter: ['class'] });
});  
  render();

// Handler del botón de WhatsApp: genera la URL al hacer click
const waBtn = document.getElementById('waFloat');
if(waBtn){
  waBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    e.stopPropagation();

    // Cerrar el tooltip antes de abrir WhatsApp
    waBtn.classList.remove('show-tip');
    sessionStorage.setItem('wa_tip_shown', '1');

    let context = 'landing';
    if(UI.view === 'dashboard') context = 'dashboard';
    else if(UI.view === 'course') context = 'course';
    else if(UI.view === 'pricing') context = 'pricing';
    else if(UI.view === 'admin') context = 'admin';

    let user = null;
    try { user = await store.getUser(); } catch(err){ user = null; }

    console.log('[WA] Click → context:', context, '| user:', user?.name || 'anónimo');

    const url = buildWhatsAppURL(context, user);
    console.log('[WA] URL generada:', decodeURIComponent(url));

    window.open(url, '_blank', 'noopener,noreferrer');
  });
  console.log('[WA] Handler del botón registrado ✓');
}  
})();

function downloadCSV(rows, filename){
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast(`Descargado: ${filename}`, 'ok');
}

// Parsea un CSV simple (sin comillas complejas)
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  if(lines.length < 2) return [];
  
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
  const rows = [];
  
  for(let i = 1; i < lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue;
    
    // Split por coma, respetando comillas
    const values = [];
    let current = '';
    let inQuotes = false;
    
    for(let c = 0; c < line.length; c++){
      const ch = line[c];
      if(ch === '"'){
        inQuotes = !inQuotes;
      } else if(ch === ',' && !inQuotes){
        values.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    values.push(current.trim());
    
    const row = {};
    headers.forEach((h, idx) => {
      row[h] = values[idx] || '';
    });
    rows.push(row);
  }
  
  return rows;
}

// Convierte la lista de niveles a objeto { b1: true, b2: true, ... }
function parseLevels(levelsStr){
  const base = { b1:false, b2:false, c1:false, c2:false };
  if(!levelsStr) return { ...base, b1: true };
  
  const parts = levelsStr.toLowerCase().split(/[;,\s]+/).filter(Boolean);
  parts.forEach(p => {
    if(base.hasOwnProperty(p)) base[p] = true;
  });
  
  // Si no se especificó nada válido, dar b1 por defecto
  if(!Object.values(base).some(v => v)) base.b1 = true;
  
  return base;
}

// Maneja el archivo seleccionado y muestra la previsualización
async function handleBulkCsv(file){
  const text = await file.text();
  const rows = parseCSV(text);
  
  if(!rows.length){
    toast('El archivo está vacío o no tiene el formato correcto', 'err');
    return;
  }
  
  // Validar filas
  const teachers = await store.getTeachers();
  const teacherMap = Object.fromEntries(teachers.map(t => [t.email.toLowerCase(), t]));
  
  const validated = rows.map((r, idx) => {
    const errors = [];
    
    if(!r.name) errors.push('Falta nombre');
    if(!r.email) errors.push('Falta email');
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) errors.push('Email inválido');
    if(!r.password) errors.push('Falta contraseña');
    else if(r.password.length < 6) errors.push('Contraseña < 6 caracteres');
    
    let teacherId = null;
    if(r.teacher_email){
      const t = teacherMap[r.teacher_email.toLowerCase()];
      if(!t) errors.push(`Docente no encontrado: ${r.teacher_email}`);
      else teacherId = t.id;
    }
    
    return {
      rowNum: idx + 2,
      data: r,
      teacherId,
      levels: parseLevels(r.levels),
      errors
    };
  });
  
  showBulkPreview(validated);
}

// Muestra el modal de previsualización

  const valid = rows.filter(r => r.errors.length === 0);
  const invalid = rows.filter(r => r.errors.length > 0);
  
  const html = `
    <h2>Previsualización de carga masiva</h2>
    <p class="modal-sub">Revisa los datos antes de confirmar. Se crearán <b>${valid.length}</b> alumnos.</p>
    
    ${invalid.length ? `
      <div style="background:var(--err-bg);border:1px solid #F5C6C0;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:#A5201A">
        <b>⚠️ ${invalid.length} fila(s) con errores</b> (no se crearán):
        <ul style="margin:8px 0 0 18px;line-height:1.6">
          ${invalid.map(r => `<li>Fila ${r.rowNum}: ${r.errors.join(', ')}</li>`).join('')}
        </ul>
      </div>
    ` : ''}
    
    ${valid.length ? `
      <div style="max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:16px">
        <table style="width:100%;border-collapse:collapse;font-size:12.5px">
          <thead>
            <tr style="background:#FAFCFF">

            </tr>
          </thead>
          <tbody>
            ${valid.map((r, i) => `
              <tr>
                <td style="padding:7px 10px;border-bottom:1px solid var(--line-2)">${i+1}</td>
                <td style="padding:7px 10px;border-bottom:1px solid var(--line-2)">${esc(r.data.name)}</td>

                <td style="padding:7px 10px;border-bottom:1px solid var(--line-2)">${r.teacherId ? '✓' : '—'}</td>

                  ${Object.entries(r.levels).filter(([,v])=>v).map(([k])=>k.toUpperCase()).join(', ')}
                </td>
              </tr>
            `).join('')}

    ` : ''}
    
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" id="btnConfirmBulk" ${valid.length === 0 ? 'disabled' : ''}>
        ✅ Crear ${valid.length} alumno(s)
      </button>
    </div>
  `;
  
  $('#checkoutContent').innerHTML = html;
  $('#checkoutModal').classList.add('show');
  
  const btn = $('#btnConfirmBulk');
  if(btn) btn.onclick = () => executeBulkUpload(valid);
}

// Ejecuta la creación masiva
async function executeBulkUpload(rows){
  const btn = $('#btnConfirmBulk');
  if(btn){
    btn.disabled = true;
    btn.textContent = 'Creando…';
  }
  
  const results = { success: 0, failed: 0, errors: [] };
  
for(const r of rows){
  try {
    const res = await fetch('https://toefl-itp.academy.sis-prep.com/api/create-student', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: r.data.name,
        email: r.data.email,
        password: r.data.password,
        teacherId: r.teacherId,
        levels: r.levels
      })
    });

    if(!res.ok){
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || 'Error al crear el alumno');
    }

    results.success++;
    if(btn){
      btn.textContent = `Creando… ${results.success + results.failed}/${rows.length}`;
    }
  } catch(err){
    results.failed++;
    results.errors.push(`${r.data.email}: ${err.message}`);
  }
}
  
  // Mostrar resumen
  const html = `
    <h2>Resultado de la carga</h2>
    <p class="modal-sub">Proceso completado.</p>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div style="background:var(--ok-bg);border-radius:12px;padding:16px;text-align:center">
        <div style="font-size:32px;font-weight:900;color:var(--ok)">${results.success}</div>
        <div style="font-size:12px;color:var(--ink-2);font-weight:700;margin-top:4px">Creados</div>
      </div>
      <div style="background:var(--err-bg);border-radius:12px;padding:16px;text-align:center">
        <div style="font-size:32px;font-weight:900;color:var(--err)">${results.failed}</div>
        <div style="font-size:12px;color:var(--ink-2);font-weight:700;margin-top:4px">Fallidos</div>
      </div>
    </div>
    
    ${results.errors.length ? `
      <div style="background:#FFF4D9;border:1px solid #FFE082;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:#8A6200">
        <b>Errores:</b>
        <ul style="margin:8px 0 0 18px;line-height:1.6">
          ${results.errors.map(e => `<li>${esc(e)}</li>`).join('')}
        </ul>
      </div>
    ` : ''}
    
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-primary" data-close onclick="location.reload()">Cerrar y recargar</button>
    </div>
  `;
  
  $('#checkoutContent').innerHTML = html;
}
  
/* ============================================================
   EXPORTAR ALUMNOS ACTUALES (para re-subir o editar)
   ============================================================ */
async function exportCurrentStudentsCSV(){
  try {
    const allUsers = await store.getAllUsers();
    const teachers = await store.getTeachers();
    const teacherMap = Object.fromEntries(teachers.map(t => [t.id, t]));

    // Filtrar solo alumnos
    const students = allUsers.filter(u => (u.role || 'student') === 'student');

    if(!students.length){
      toast('No hay alumnos registrados todavía', 'err');
      return;
    }

    // Encabezados del CSV (mismo formato que la carga masiva)
    const headers = ['name', 'email', 'password', 'teacher_email', 'levels'];
    const rows = [headers.join(',')];

    students.forEach(s => {
      // Niveles activos como string "b1;b2"
      const levels = Object.entries(s.levels || {})
        .filter(([, v]) => v)
        .map(([k]) => k)
        .join(';') || 'b1';

      // Email del docente asignado (si tiene)
      const teacherEmail = s.teacher_id 
        ? (teacherMap[s.teacher_id]?.email || '')
        : '';

      // Escapar campos con comas o comillas
      const esc = (v) => {
        const str = String(v || '');
        if(str.includes(',') || str.includes('"') || str.includes('\n')){
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };

      rows.push([
        esc(s.name),
        esc(s.email),
        '',                       // password: vacío (no se puede exportar)
        esc(teacherEmail),
        esc(levels)
      ].join(','));
    });

    const csv = rows.join('\n');
    const date = new Date().toISOString().split('T')[0];   // YYYY-MM-DD
    const filename = `alumnos-actuales-${date}.csv`;

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);

    toast(`Descargados ${students.length} alumnos en ${filename}`, 'ok');
  } catch(err){
    console.error('[exportCurrentStudentsCSV] Error:', err);
    toast('Error al exportar: ' + err.message, 'err');
  }
}  
/* ============================================================
   CERTIFICADOS PDF
   ============================================================ */
async function generateCertificate(user, levelId){
  const level = getLevel(levelId);
  const prog = await store.getProgress(user.id);
  const levelDialogues = DIALOGUES.filter(d => d.level === levelId);
  const completed = levelDialogues.filter(d => prog.completed.includes(d.id)).length;
  
  if(completed < levelDialogues.length){
    toast('Aún no completas todos los módulos de este nivel', 'err');
    return;
  }

  const accuracy = prog.quizScores.length
    ? Math.round(prog.quizScores.reduce((s,q)=>s+q.score,0) / prog.quizScores.reduce((s,q)=>s+q.total,0) * 100)
    : 0;
  
  const date = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  const certId = `TOEFL-${levelId.toUpperCase()}-${user.id.substring(0,8)}-${Date.now().toString(36).toUpperCase()}`;

  // 1. Crear el HTML del certificado (oculto)
  const certDiv = document.createElement('div');
  certDiv.style.cssText = `
    position: fixed; left: -9999px; top: 0;
    width: 1122px; height: 794px; /* A4 horizontal a 96dpi */
    background: linear-gradient(135deg, #001B41 0%, #0A2E5C 100%);
    padding: 40px; font-family: 'Inter', sans-serif;
  `;
  
  certDiv.innerHTML = `
    <div style="width:100%;height:100%;background:#fff;border-radius:20px;padding:50px 60px;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:center;text-align:center;border:6px solid #FFB81C">
      <div style="font-size:14px;font-weight:800;color:#0072CE;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px">TOEFL ITP English Academy</div>
      <div style="font-size:40px;font-weight:900;color:#001B41;letter-spacing:-1px;margin-bottom:8px">CERTIFICADO</div>
      <div style="font-size:16px;color:#8494AB;font-weight:600;margin-bottom:40px">DE FINALIZACIÓN</div>
      
      <div style="font-size:15px;color:#4A5B76;margin-bottom:8px">Se otorga el presente certificado a</div>
      <div style="font-size:48px;font-weight:800;color:#001B41;letter-spacing:-1px;margin-bottom:30px;border-bottom:2px solid #E1E9F3;padding-bottom:15px;display:inline-block;margin-left:auto;margin-right:auto">${esc(user.name)}</div>
      
      <div style="font-size:15px;color:#4A5B76;margin-bottom:8px">por haber completado satisfactoriamente el nivel</div>
      <div style="font-size:36px;font-weight:900;color:${level.color};margin-bottom:30px">${level.code} · ${level.name}</div>
      
      <div style="display:flex;justify-content:center;gap:60px;margin-bottom:30px;font-size:14px;color:#4A5B76">
        <div><b style="color:#001B41">Precisión:</b> ${accuracy}%</div>
        <div><b style="color:#001B41">Módulos:</b> ${completed}/${levelDialogues.length}</div>
        <div><b style="color:#001B41">Fecha:</b> ${date}</div>
      </div>
      
      <div style="position:absolute;bottom:40px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;color:#8494AB">
        <div style="text-align:left">
          <div style="font-weight:700;color:#001B41;font-size:13px">ID del certificado</div>
          <div style="font-family:monospace">${certId}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:700;color:#001B41;font-size:13px">Verificar en</div>
          <div>toefl-itp.academy.sis-prep.com</div>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(certDiv);

  try {
    // 2. Convertir el HTML a imagen
    const canvas = await html2canvas(certDiv, { scale: 2, useCORS: true });
    const imgData = canvas.toDataURL('image/png');

    // 3. Crear el PDF (A4 horizontal)
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    pdf.addImage(imgData, 'PNG', 0, (pageHeight - imgHeight) / 2, imgWidth, imgHeight);
    pdf.save(`Certificado_${level.code}_${user.name.replace(/\s+/g, '_')}.pdf`);
    
    toast('¡Certificado descargado! 🎉', 'ok');
  } catch (err) {
    console.error('[Certificado] Error:', err);
    toast('Error al generar el certificado', 'err');
  } finally {
    // 4. Limpiar el div temporal
    document.body.removeChild(certDiv);
  }
} // end generateCertificate
  
render();

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everyday Conversations · TOEFL ITP Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS · PALETA INSTITUCIONAL TOEFL ITP
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Azul marino profundo */
  --navy-900:#000E24;
  --navy-800:#001B41;
  --navy-700:#0A2E5C;
  --navy-600:#123E73;
  /* Azul TOEFL */
  --blue:#0072CE;
  --blue-600:#005BA5;
  --blue-500:#1F87E0;
  --blue-100:#E6F2FB;
  --blue-50:#F3F8FD;
  /* Dorado acento */
  --gold:#FFB81C;
  --gold-600:#E6A200;
  --gold-100:#FFF4D9;
  /* Neutros */
  --ink:#001B41;
  --ink-soft:#4A5B76;
  --ink-faint:#8494AB;
  --line:#E1E9F3;
  --line-soft:#EEF3F9;
  --bg:#F7FAFD;
  --card:#FFFFFF;
  /* Estados */
  --success:#0F9D58;
  --success-bg:#E7F7EE;
  --danger:#D93025;
  --danger-bg:#FDECEA;
  /* Sombras en capas */
  --shadow-sm:0 1px 2px rgba(0,27,65,.05);
  --shadow:0 1px 3px rgba(0,27,65,.06), 0 8px 24px rgba(0,27,65,.06);
  --shadow-md:0 2px 6px rgba(0,27,65,.07), 0 16px 40px rgba(0,27,65,.08);
  --shadow-lg:0 4px 12px rgba(0,27,65,.09), 0 24px 60px rgba(0,27,65,.12);
  /* Radios */
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:22px;
  /* Transición */
  --t:cubic-bezier(.4,.14,.3,1);
}

html,body{height:100%}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  font-feature-settings:'cv02','cv03','cv04','cv11';
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em;
}

#app{display:flex;height:100vh;width:100%}

/* =========================================================
   SIDEBAR
   ========================================================= */
#sidebar{
  width:320px;flex:0 0 320px;
  background:linear-gradient(180deg,#001B41 0%,#00112E 60%,#00091E 100%);
  color:#E8EEF8;
  display:flex;flex-direction:column;height:100vh;
  box-shadow:6px 0 32px rgba(0,11,30,.25);
  z-index:40;
  position:relative;
}
#sidebar::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 0%, rgba(0,114,206,.18), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(255,184,28,.08), transparent 40%);
}

.brand{
  display:flex;gap:13px;align-items:center;
  padding:22px 20px 16px;position:relative;
}
.brand-icon{
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--blue),#3E9EE8);
  box-shadow:0 8px 20px rgba(0,114,206,.45), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;
}
.brand-icon::after{
  content:'';position:absolute;right:-3px;bottom:-3px;
  width:14px;height:14px;border-radius:50%;
  background:var(--gold);
  border:2px solid #001B41;
}
.brand h1{
  font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:#fff;
}
.brand p{font-size:11px;color:#7A93B8;margin-top:3px;letter-spacing:.02em;font-weight:500}

.search-box{padding:6px 18px 16px;position:relative;z-index:1}
.search-box input{
  width:100%;padding:11px 14px 11px 38px;
  border-radius:var(--r-md);
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:13px;outline:none;
  font-family:inherit;
  transition:all .2s var(--t);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237A93B8' stroke-width='2.5' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");
  background-repeat:no-repeat;
  background-position:14px center;
}
.search-box input::placeholder{color:#6B85AC;font-weight:500}
.search-box input:focus{
  background-color:rgba(255,255,255,.11);
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,114,206,.25);
}

#nav{flex:1;overflow-y:auto;padding:0 12px 16px;position:relative;z-index:1}
#nav::-webkit-scrollbar{width:6px}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
#nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}

.unit-title{
  font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;
  color:#6B85AC;padding:16px 10px 8px;font-weight:700;
}

.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 11px;border-radius:var(--r-md);
  background:transparent;border:none;color:#C7D3E5;
  font-size:12.8px;text-align:left;cursor:pointer;
  transition:all .18s var(--t);
  font-family:inherit;line-height:1.3;margin-bottom:2px;
  font-weight:500;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{
  background:linear-gradient(90deg,rgba(0,114,206,.9),rgba(0,114,206,.35));
  color:#fff;font-weight:600;
  box-shadow:0 4px 14px rgba(0,114,206,.3);
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--gold);
}
.nav-emoji{font-size:15px;flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.nav-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-text b{color:#6FA8E0;font-size:10.5px;margin-right:6px;font-weight:700;letter-spacing:.03em}
.nav-item.active .nav-text b{color:#A9D4FF}
.nav-check{
  color:var(--gold);font-weight:800;font-size:13px;
  text-shadow:0 0 8px rgba(255,184,28,.5);
}

.side-footer{
  padding:16px 20px 20px;
  border-top:1px solid rgba(255,255,255,.08);
  position:relative;z-index:1;
  background:rgba(0,0,0,.15);
}
.progress-info{
  display:flex;justify-content:space-between;
  font-size:11.5px;color:#93A8C7;margin-bottom:9px;
  font-weight:500;letter-spacing:.02em;
}
.progress-info b{color:#fff;font-weight:700}
.progress-bar{
  height:6px;background:rgba(255,255,255,.1);
  border-radius:8px;overflow:hidden;margin-bottom:15px;
}
#progressFill{
  height:100%;width:0;border-radius:8px;
  background:linear-gradient(90deg,var(--blue),var(--gold));
  transition:width .6s var(--t);
  box-shadow:0 0 12px rgba(255,184,28,.4);
}

.btn-primary{
  width:100%;padding:12px;border:none;border-radius:var(--r-md);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
  color:#001B41;
  background:linear-gradient(135deg,var(--gold),#FFCD4A);
  box-shadow:0 6px 18px rgba(255,184,28,.35), inset 0 1px 0 rgba(255,255,255,.4);
  transition:all .2s var(--t);
  letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(255,184,28,.45), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn-primary:active{transform:translateY(0)}

/* =========================================================
   MAIN
   ========================================================= */
#main{
  flex:1;display:flex;flex-direction:column;
  height:100vh;overflow:hidden;position:relative;
  background:var(--bg);
}

#topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 28px;height:68px;flex:0 0 68px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--line);
  z-index:10;
}
#menuBtn{
  display:none;background:none;border:none;
  font-size:22px;cursor:pointer;color:var(--ink);
  padding:6px;border-radius:8px;
}
#menuBtn:hover{background:var(--blue-50)}

#topTitle{
  font-size:14.5px;font-weight:600;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink);letter-spacing:-.02em;
}
#topTitle b{font-weight:700;color:var(--navy-800)}
#topTitle span{color:var(--ink-faint);font-weight:500}

.tabs{
  display:flex;gap:3px;background:var(--blue-50);
  padding:4px;border-radius:11px;
  border:1px solid var(--line-soft);
}
.tab{
  padding:8px 15px;border-radius:8px;border:none;
  background:transparent;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink-soft);transition:all .2s var(--t);
  white-space:nowrap;letter-spacing:-.01em;
}
.tab:hover{color:var(--blue)}
.tab.active{
  background:#fff;color:var(--blue);
  box-shadow:0 2px 6px rgba(0,27,65,.1);
}

#content{
  flex:1;overflow-y:auto;
  padding:28px 32px 80px;
  scroll-behavior:smooth;
}
#content::-webkit-scrollbar{width:10px}
#content::-webkit-scrollbar-thumb{
  background:#C7D5E5;border-radius:8px;border:3px solid var(--bg);
}
#content::-webkit-scrollbar-thumb:hover{background:#A8BBD2}
.wrap{max-width:920px;margin:0 auto;animation:pageIn .35s var(--t)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* =========================================================
   DIALOGUE HEADER
   ========================================================= */
.dlg-head{
  background:
    radial-gradient(circle at 100% 0%, rgba(255,184,28,.18), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(0,114,206,.35), transparent 50%),
    linear-gradient(135deg,#001B41,#00112E 60%,#00091E);
  border-radius:var(--r-xl);
  padding:30px 32px;color:#fff;
  box-shadow:var(--shadow-lg);
  margin-bottom:24px;
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
}
.dlg-head::before{
  content:'';position:absolute;right:-60px;top:-60px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,184,28,.18),transparent 65%);
}
.dlg-head::after{
  content:'';position:absolute;left:0;bottom:0;
  width:100%;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--gold),transparent);
}
.dlg-head .badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,114,206,.25);
  border:1px solid rgba(0,114,206,.4);
  padding:5px 12px;border-radius:20px;
  font-size:10.5px;font-weight:700;letter-spacing:1px;
  color:#8CC7FF;margin-bottom:12px;
  text-transform:uppercase;
  backdrop-filter:blur(6px);
}
.dlg-head .badge::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 8px var(--gold);
}
.dlg-head h2{
  font-size:28px;font-weight:800;
  letter-spacing:-.03em;line-height:1.15;
  position:relative;z-index:1;color:#fff;
}
.dlg-head .sub{
  font-size:13.5px;color:#A9BBD6;
  margin-top:7px;position:relative;z-index:1;
  font-weight:500;
}
.chips{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-top:18px;position:relative;z-index:1;
}
.chip{
  font-size:11.5px;font-weight:600;
  padding:6px 13px;border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
  letter-spacing:.01em;
  color:#E8EEF8;
  display:inline-flex;align-items:center;
}

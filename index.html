<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everyday Conversations · TOEFL ITP Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS · PALETA INSTITUCIONAL TOEFL ITP
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Azul marino profundo */
  --navy-900:#000E24;
  --navy-800:#001B41;
  --navy-700:#0A2E5C;
  --navy-600:#123E73;
  /* Azul TOEFL */
  --blue:#0072CE;
  --blue-600:#005BA5;
  --blue-500:#1F87E0;
  --blue-100:#E6F2FB;
  --blue-50:#F3F8FD;
  /* Dorado acento */
  --gold:#FFB81C;
  --gold-600:#E6A200;
  --gold-100:#FFF4D9;
  /* Neutros */
  --ink:#001B41;
  --ink-soft:#4A5B76;
  --ink-faint:#8494AB;
  --line:#E1E9F3;
  --line-soft:#EEF3F9;
  --bg:#F7FAFD;
  --card:#FFFFFF;
  /* Estados */
  --success:#0F9D58;
  --success-bg:#E7F7EE;
  --danger:#D93025;
  --danger-bg:#FDECEA;
  /* Sombras en capas */
  --shadow-sm:0 1px 2px rgba(0,27,65,.05);
  --shadow:0 1px 3px rgba(0,27,65,.06), 0 8px 24px rgba(0,27,65,.06);
  --shadow-md:0 2px 6px rgba(0,27,65,.07), 0 16px 40px rgba(0,27,65,.08);
  --shadow-lg:0 4px 12px rgba(0,27,65,.09), 0 24px 60px rgba(0,27,65,.12);
  /* Radios */
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:22px;
  /* Transición */
  --t:cubic-bezier(.4,.14,.3,1);
}

html,body{height:100%}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  font-feature-settings:'cv02','cv03','cv04','cv11';
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em;
}

#app{display:flex;height:100vh;width:100%}

/* =========================================================
   SIDEBAR
   ========================================================= */
#sidebar{
  width:320px;flex:0 0 320px;
  background:linear-gradient(180deg,#001B41 0%,#00112E 60%,#00091E 100%);
  color:#E8EEF8;
  display:flex;flex-direction:column;height:100vh;
  box-shadow:6px 0 32px rgba(0,11,30,.25);
  z-index:40;
  position:relative;
}
#sidebar::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 0%, rgba(0,114,206,.18), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(255,184,28,.08), transparent 40%);
}

.brand{
  display:flex;gap:13px;align-items:center;
  padding:22px 20px 16px;position:relative;
}
.brand-icon{
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--blue),#3E9EE8);
  box-shadow:0 8px 20px rgba(0,114,206,.45), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;
}
.brand-icon::after{
  content:'';position:absolute;right:-3px;bottom:-3px;
  width:14px;height:14px;border-radius:50%;
  background:var(--gold);
  border:2px solid #001B41;
}
.brand h1{
  font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:#fff;
}
.brand p{font-size:11px;color:#7A93B8;margin-top:3px;letter-spacing:.02em;font-weight:500}

.search-box{padding:6px 18px 16px;position:relative;z-index:1}
.search-box input{
  width:100%;padding:11px 14px 11px 38px;
  border-radius:var(--r-md);
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:13px;outline:none;
  font-family:inherit;
  transition:all .2s var(--t);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237A93B8' stroke-width='2.5' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");
  background-repeat:no-repeat;
  background-position:14px center;
}
.search-box input::placeholder{color:#6B85AC;font-weight:500}
.search-box input:focus{
  background-color:rgba(255,255,255,.11);
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,114,206,.25);
}

#nav{flex:1;overflow-y:auto;padding:0 12px 16px;position:relative;z-index:1}
#nav::-webkit-scrollbar{width:6px}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
#nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}

.unit-title{
  font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;
  color:#6B85AC;padding:16px 10px 8px;font-weight:700;
}

.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 11px;border-radius:var(--r-md);
  background:transparent;border:none;color:#C7D3E5;
  font-size:12.8px;text-align:left;cursor:pointer;
  transition:all .18s var(--t);
  font-family:inherit;line-height:1.3;margin-bottom:2px;
  font-weight:500;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{
  background:linear-gradient(90deg,rgba(0,114,206,.9),rgba(0,114,206,.35));
  color:#fff;font-weight:600;
  box-shadow:0 4px 14px rgba(0,114,206,.3);
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--gold);
}
.nav-emoji{font-size:15px;flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.nav-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-text b{color:#6FA8E0;font-size:10.5px;margin-right:6px;font-weight:700;letter-spacing:.03em}
.nav-item.active .nav-text b{color:#A9D4FF}
.nav-check{
  color:var(--gold);font-weight:800;font-size:13px;
  text-shadow:0 0 8px rgba(255,184,28,.5);
}

.side-footer{
  padding:16px 20px 20px;
  border-top:1px solid rgba(255,255,255,.08);
  position:relative;z-index:1;
  background:rgba(0,0,0,.15);
}
.progress-info{
  display:flex;justify-content:space-between;
  font-size:11.5px;color:#93A8C7;margin-bottom:9px;
  font-weight:500;letter-spacing:.02em;
}
.progress-info b{color:#fff;font-weight:700}
.progress-bar{
  height:6px;background:rgba(255,255,255,.1);
  border-radius:8px;overflow:hidden;margin-bottom:15px;
}
#progressFill{
  height:100%;width:0;border-radius:8px;
  background:linear-gradient(90deg,var(--blue),var(--gold));
  transition:width .6s var(--t);
  box-shadow:0 0 12px rgba(255,184,28,.4);
}

.btn-primary{
  width:100%;padding:12px;border:none;border-radius:var(--r-md);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
  color:#001B41;
  background:linear-gradient(135deg,var(--gold),#FFCD4A);
  box-shadow:0 6px 18px rgba(255,184,28,.35), inset 0 1px 0 rgba(255,255,255,.4);
  transition:all .2s var(--t);
  letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(255,184,28,.45), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn-primary:active{transform:translateY(0)}

/* =========================================================
   MAIN
   ========================================================= */
#main{
  flex:1;display:flex;flex-direction:column;
  height:100vh;overflow:hidden;position:relative;
  background:var(--bg);
}

#topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 28px;height:68px;flex:0 0 68px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--line);
  z-index:10;
}
#menuBtn{
  display:none;background:none;border:none;
  font-size:22px;cursor:pointer;color:var(--ink);
  padding:6px;border-radius:8px;
}
#menuBtn:hover{background:var(--blue-50)}

#topTitle{
  font-size:14.5px;font-weight:600;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink);letter-spacing:-.02em;
}
#topTitle b{font-weight:700;color:var(--navy-800)}
#topTitle span{color:var(--ink-faint);font-weight:500}

.tabs{
  display:flex;gap:3px;background:var(--blue-50);
  padding:4px;border-radius:11px;
  border:1px solid var(--line-soft);
}
.tab{
  padding:8px 15px;border-radius:8px;border:none;
  background:transparent;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink-soft);transition:all .2s var(--t);
  white-space:nowrap;letter-spacing:-.01em;
}
.tab:hover{color:var(--blue)}
.tab.active{
  background:#fff;color:var(--blue);
  box-shadow:0 2px 6px rgba(0,27,65,.1);
}

#content{
  flex:1;overflow-y:auto;
  padding:28px 32px 80px;
  scroll-behavior:smooth;
}
#content::-webkit-scrollbar{width:10px}
#content::-webkit-scrollbar-thumb{
  background:#C7D5E5;border-radius:8px;border:3px solid var(--bg);
}
#content::-webkit-scrollbar-thumb:hover{background:#A8BBD2}
.wrap{max-width:920px;margin:0 auto;animation:pageIn .35s var(--t)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* =========================================================
   DIALOGUE HEADER
   ========================================================= */
.dlg-head{
  background:
    radial-gradient(circle at 100% 0%, rgba(255,184,28,.18), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(0,114,206,.35), transparent 50%),
    linear-gradient(135deg,#001B41,#00112E 60%,#00091E);
  border-radius:var(--r-xl);
  padding:30px 32px;color:#fff;
  box-shadow:var(--shadow-lg);
  margin-bottom:24px;
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
}
.dlg-head::before{
  content:'';position:absolute;right:-60px;top:-60px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,184,28,.18),transparent 65%);
}
.dlg-head::after{
  content:'';position:absolute;left:0;bottom:0;
  width:100%;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--gold),transparent);
}
.dlg-head .badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,114,206,.25);
  border:1px solid rgba(0,114,206,.4);
  padding:5px 12px;border-radius:20px;
  font-size:10.5px;font-weight:700;letter-spacing:1px;
  color:#8CC7FF;margin-bottom:12px;
  text-transform:uppercase;
  backdrop-filter:blur(6px);
}
.dlg-head .badge::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 8px var(--gold);
}
.dlg-head h2{
  font-size:28px;font-weight:800;
  letter-spacing:-.03em;line-height:1.15;
  position:relative;z-index:1;color:#fff;
}
.dlg-head .sub{
  font-size:13.5px;color:#A9BBD6;
  margin-top:7px;position:relative;z-index:1;
  font-weight:500;
}
.chips{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-top:18px;position:relative;z-index:1;
}
.chip{
  font-size:11.5px;font-weight:600;
  padding:6px 13px;border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
  letter-spacing:.01em;
  color:#E8EEF8;
  display:inline-flex;align-items:center;
}

   /* =========================================================
   TOOLBAR
   ========================================================= */
.toolbar{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  background:#fff;border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px 16px;
  margin-bottom:22px;
  box-shadow:var(--shadow);
}
.tool{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:10px;
  border:1.5px solid var(--line);
  background:#fff;font-family:inherit;
  font-size:12.5px;font-weight:600;
  color:var(--ink);cursor:pointer;
  transition:all .18s var(--t);
  letter-spacing:-.01em;
  white-space:nowrap;
}
.tool:hover{
  border-color:var(--blue);
  color:var(--blue);
  background:var(--blue-50);
  transform:translateY(-1px);
}
.tool.on{
  background:var(--blue);border-color:var(--blue);
  color:#fff;box-shadow:0 4px 12px rgba(0,114,206,.3);
}
.tool.done{
  background:var(--success);border-color:var(--success);
  color:#fff;box-shadow:0 4px 12px rgba(15,157,88,.3);
}
.tool select{
  border:none;background:transparent;
  font-family:inherit;font-size:12.5px;
  font-weight:600;color:inherit;
  cursor:pointer;outline:none;
  padding:0 2px;
}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}

/* =========================================================
   LINES / BUBBLES
   ========================================================= */
.lines{display:flex;flex-direction:column;gap:16px}
.line{
  display:flex;gap:13px;align-items:flex-start;
  animation:fade .4s var(--t) both;
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.avatar{
  width:42px;height:42px;border-radius:13px;
  flex:0 0 42px;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff;
  letter-spacing:-.02em;
  box-shadow:0 4px 10px rgba(0,27,65,.18), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .2s var(--t);
}
.line:hover .avatar{transform:scale(1.06)}
.bubble{
  flex:1;background:#fff;
  border:1px solid var(--line);
  border-radius:6px 18px 18px 18px;
  padding:14px 18px 13px;
  box-shadow:var(--shadow-sm);
  position:relative;
  transition:all .25s var(--t);
}
.bubble:hover{
  border-color:#CFDCEC;
  box-shadow:var(--shadow);
}
.line.speaking .bubble{
  border-color:var(--blue);
  background:linear-gradient(180deg,#F5FAFF,#fff);
  box-shadow:0 0 0 3px rgba(0,114,206,.12), var(--shadow);
}
.speaker{
  font-size:10.5px;font-weight:800;
  letter-spacing:.9px;text-transform:uppercase;
  margin-bottom:6px;
}
.text{
  font-size:15.5px;line-height:1.65;
  color:#0A1E3D;
  cursor:pointer;
  transition:filter .2s;
  font-weight:400;
}
.text:hover{filter:brightness(.85)}
.text.hidden{
  filter:blur(6px);
  user-select:none;pointer-events:none;
}
.line-actions{
  display:flex;gap:6px;margin-top:10px;align-items:center;
}
.mini{
  border:none;background:var(--blue-50);
  color:var(--ink-soft);width:30px;height:30px;
  border-radius:9px;cursor:pointer;font-size:13px;
  display:grid;place-items:center;
  transition:all .18s var(--t);
}
.mini:hover{background:var(--blue);color:#fff;transform:translateY(-1px)}
.mini.speaking{
  background:var(--blue);color:#fff;
  animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.94)}}
.turn-hint{
  font-size:12.5px;color:var(--blue);
  font-weight:700;font-style:italic;
  background:var(--blue-50);
  border:1px dashed var(--blue-500);
  border-radius:10px;padding:10px 14px;margin-top:8px;
  display:flex;align-items:center;gap:8px;
}
.turn-hint::before{content:'🎤';font-style:normal}

/* =========================================================
   PANELS
   ========================================================= */
.panel{
  background:#fff;border:1px solid var(--line);
  border-radius:var(--r-lg);padding:24px 26px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}
.panel h3{
  font-size:16.5px;font-weight:700;
  margin-bottom:16px;display:flex;
  align-items:center;gap:10px;
  color:var(--navy-800);
  letter-spacing:-.02em;
}
.panel h3 .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 4px rgba(255,184,28,.18);
}
.note{
  display:flex;gap:12px;padding:13px 0;
  border-bottom:1px dashed var(--line);
  font-size:13.8px;line-height:1.68;
  color:#1E3354;
}
.note:last-child{border-bottom:none}
.note .n{
  color:var(--blue);font-weight:800;
  flex:0 0 auto;font-size:13px;
  width:22px;height:22px;border-radius:7px;
  background:var(--blue-50);
  display:grid;place-items:center;
  margin-top:1px;
}
.note em{
  color:var(--blue-600);font-style:italic;
  font-weight:600;
  background:var(--blue-50);
  padding:1px 5px;border-radius:4px;
}
.note b{color:var(--navy-800);font-weight:700}

/* Frases clave */
.phrase{
  display:flex;justify-content:space-between;
  gap:16px;align-items:center;
  padding:14px 16px;border-radius:12px;
  background:linear-gradient(135deg,#FBFDFF,#F5F9FE);
  border:1px solid var(--line-soft);
  margin-bottom:10px;
  transition:all .2s var(--t);
}
.phrase:hover{
  background:linear-gradient(135deg,#F3F8FD,#E9F2FC);
  border-color:#CFE0F2;
  transform:translateX(2px);
}
.phrase .en{
  font-size:14.8px;font-weight:600;
  color:var(--navy-800);line-height:1.4;
  letter-spacing:-.01em;
}
.phrase .es{
  font-size:13px;color:var(--ink-soft);
  margin-top:4px;line-height:1.45;
}
.phrase .say{
  flex:0 0 auto;width:38px;height:38px;
  border-radius:11px;border:1px solid var(--line);
  background:#fff;color:var(--blue);
  cursor:pointer;font-size:15px;
  box-shadow:var(--shadow-sm);
  transition:all .18s var(--t);
}
.phrase .say:hover{
  background:var(--blue);color:#fff;
  border-color:var(--blue);
  transform:translateY(-1px) scale(1.05);
  box-shadow:0 6px 16px rgba(0,114,206,.35);
}
.phrase .say.speaking{
  background:var(--blue);color:#fff;
  border-color:var(--blue);
  animation:pulse 1s infinite;
   }
   /* =========================================================
   PRACTICE · CLOZE
   ========================================================= */
.cloze-item{
  background:linear-gradient(180deg,#fff,#FBFDFF);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:18px 20px;margin-bottom:13px;
  box-shadow:var(--shadow-sm);
  transition:all .2s var(--t);
}
.cloze-item:focus-within{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,114,206,.12), var(--shadow);
}
.cloze-item .who{
  font-size:10.5px;font-weight:800;
  letter-spacing:.9px;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:9px;
}
.cloze-txt{
  font-size:15.3px;line-height:2;
  color:#0A1E3D;font-weight:400;
}
.cloze-txt input{
  border:none;border-bottom:2.5px solid var(--blue);
  background:var(--blue-50);
  font-family:inherit;font-size:15px;font-weight:700;
  color:var(--blue-600);padding:3px 10px;
  min-width:130px;outline:none;
  border-radius:7px 7px 0 0;
  text-align:center;
  transition:all .18s var(--t);
}
.cloze-txt input:focus{
  background:var(--blue-100);
  box-shadow:0 4px 12px rgba(0,114,206,.15);
}
.cloze-txt input.ok{
  border-color:var(--success);
  background:var(--success-bg);
  color:#0A6B3E;
}
.cloze-txt input.bad{
  border-color:var(--danger);
  background:var(--danger-bg);
  color:#A5201A;
}
.fb{
  font-size:12.5px;font-weight:600;
  margin-top:9px;display:none;
  padding:6px 10px;border-radius:7px;
}
.fb.show{display:inline-block}
.fb.ok{color:#0A6B3E;background:var(--success-bg)}
.fb.bad{color:#A5201A;background:var(--danger-bg)}

/* =========================================================
   BUTTONS
   ========================================================= */
.actions{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;
}
.btn{
  padding:12px 22px;border-radius:11px;border:none;
  font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .2s var(--t);
  letter-spacing:-.01em;
  display:inline-flex;align-items:center;gap:7px;
}
.btn.b1{
  background:linear-gradient(135deg,var(--blue),var(--blue-600));
  color:#fff;
  box-shadow:0 6px 16px rgba(0,114,206,.35), inset 0 1px 0 rgba(255,255,255,.15);
}
.btn.b1:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(0,114,206,.45);
}
.btn.b2{
  background:#fff;color:var(--ink);
  border:1.5px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.btn.b2:hover{
  border-color:var(--blue);
  color:var(--blue);
  background:var(--blue-50);
  transform:translateY(-1px);
}

/* =========================================================
   QUIZ
   ========================================================= */
.quiz-card{
  background:#fff;border:1px solid var(--line);
  border-radius:var(--r-xl);
  padding:30px 32px;
  box-shadow:var(--shadow-md);
  position:relative;overflow:hidden;
}
.quiz-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--blue),var(--gold));
}
.qmeta{
  display:flex;justify-content:space-between;
  font-size:12px;font-weight:700;
  color:var(--ink-faint);margin-bottom:16px;
  letter-spacing:.03em;text-transform:uppercase;
}
.qbar{
  height:6px;background:var(--line-soft);
  border-radius:6px;overflow:hidden;margin-bottom:24px;
}
.qbar div{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--gold));
  width:0;transition:width .4s var(--t);
  border-radius:6px;
}
.qtext{
  font-size:22px;font-weight:800;
  line-height:1.4;margin-bottom:10px;
  color:var(--navy-800);
  letter-spacing:-.025em;
}
.qsub{
  font-size:12.5px;color:var(--ink-faint);
  margin-bottom:22px;font-weight:500;
}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  text-align:left;padding:15px 18px;
  border-radius:12px;border:1.5px solid var(--line);
  background:#fff;font-family:inherit;
  font-size:14.5px;font-weight:600;
  color:var(--ink);cursor:pointer;
  transition:all .18s var(--t);
  line-height:1.4;letter-spacing:-.01em;
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;
}
.opt:hover:not(:disabled){
  border-color:var(--blue);
  background:var(--blue-50);
  transform:translateX(3px);
}
.opt:disabled{cursor:default}
.opt.correct{
  background:var(--success-bg);
  border-color:var(--success);
  color:#0A6B3E;
}
.opt.wrong{
  background:var(--danger-bg);
  border-color:var(--danger);
  color:#A5201A;
}
.opt .mark{font-weight:900;font-size:16px}

/* =========================================================
   EMPTY / WELCOME
   ========================================================= */
.empty{
  text-align:center;padding:80px 20px;
  color:var(--ink-soft);
}
.empty .big{
  font-size:60px;margin-bottom:20px;
  display:inline-block;
  animation:bounce 2.5s ease-in-out infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
.empty h3{
  font-size:22px;color:var(--navy-800);
  margin-bottom:12px;font-weight:800;
  letter-spacing:-.025em;
}
.empty p{
  font-size:14.5px;max-width:460px;
  margin:0 auto;line-height:1.7;
  color:var(--ink-soft);
}

/* =========================================================
   BACKDROP (mobile sidebar)
   ========================================================= */
.backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(0,11,30,.55);
  z-index:35;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.backdrop.show{display:block;animation:fadeBack .25s ease}
@keyframes fadeBack{from{opacity:0}to{opacity:1}}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media(max-width:900px){
  #sidebar{
    position:fixed;left:0;top:0;
    transform:translateX(-100%);
    transition:transform .3s var(--t);
    width:300px;flex-basis:300px;
  }
  #sidebar.open{transform:none}
  #menuBtn{display:block}
  #content{padding:20px 16px 70px}
  .dlg-head{padding:22px 22px}
  .dlg-head h2{font-size:22px}
  .tabs{display:none}
  #topbar{padding:0 14px;height:60px;flex:0 0 60px}
  #topTitle{font-size:13.5px}
  .qtext{font-size:18px}
  .quiz-card{padding:22px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">💬</div>
      <div>
        <h1>Everyday Conversations</h1>
        <p>TOEFL ITP · Study Guide</p>
      </div>
    </div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Buscar diálogo o tema…">
    </div>
    <nav id="nav"></nav>
    <div class="side-footer">
      <div class="progress-info">
        <span>Progreso del curso</span>
        <span><b id="progressText">0/30</b></span>
      </div>
      <div class="progress-bar"><div id="progressFill"></div></div>
      <button class="btn-primary" id="quizBtn">🎯 Quiz rápido (10 preguntas)</button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main id="main">
    <header id="topbar">
      <button id="menuBtn">☰</button>
      <div id="topTitle">Selecciona un diálogo <span>←</span></div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="dialogo">Diálogo</button>
        <button class="tab" data-tab="notas">Notas</button>
        <button class="tab" data-tab="frases">Frases clave</button>
        <button class="tab" data-tab="practica">Práctica</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>

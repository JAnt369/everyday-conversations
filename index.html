<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL ITP English Academy · Domina el inglés con confianza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23001B41'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%230072CE'/%3E%3Ccircle cx='74' cy='74' r='9' fill='%23FFB81C'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#001B41; --navy-2:#0A2E5C; --navy-3:#00112E;
  --blue:#0072CE; --blue-2:#005BA5; --blue-light:#E6F2FB; --blue-50:#F3F8FD;
  --gold:#FFB81C; --gold-2:#E6A200; --gold-light:#FFF4D9;
  --ink:#001B41; --ink-2:#4A5B76; --ink-3:#8494AB;
  --line:#E1E9F3; --line-2:#EEF3F9;
  --bg:#F7FAFD; --card:#fff;
  --ok:#0F9D58; --ok-bg:#E7F7EE;
  --err:#D93025; --err-bg:#FDECEA;
  --shadow:0 1px 3px rgba(0,27,65,.06),0 8px 24px rgba(0,27,65,.06);
  --shadow-md:0 2px 8px rgba(0,27,65,.08),0 20px 48px rgba(0,27,65,.10);
  --shadow-lg:0 8px 24px rgba(0,27,65,.12),0 32px 80px rgba(0,27,65,.14);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  --t:cubic-bezier(.4,.14,.3,1);
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  font-feature-settings:'cv02','cv03','cv04','cv11';
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;line-height:1.5;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;letter-spacing:inherit}
input,select,textarea{font-family:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}

/* ============ TOP NAV (Landing / App) ============ */
.topnav{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:20px;
  padding:0 32px;height:72px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.topnav.dark{
  background:rgba(0,17,46,.7);
  border-bottom-color:rgba(255,255,255,.08);
  color:#fff;
}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo-icon{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,var(--blue),#3E9EE8);
  box-shadow:0 8px 20px rgba(0,114,206,.4),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;color:#fff;
}
.logo-icon::after{
  content:'';position:absolute;right:-3px;bottom:-3px;
  width:12px;height:12px;border-radius:50%;background:var(--gold);
  border:2px solid var(--navy);
}
.topnav.dark .logo-icon::after{border-color:var(--navy-3)}
.logo small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.topnav.dark .logo small{color:#7A93B8}
.nav-spacer{flex:1}
.nav-links{display:flex;gap:6px}
.nav-links button{
  padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;
  color:var(--ink-2);transition:.18s var(--t);
}
.nav-links button:hover{background:var(--blue-50);color:var(--blue)}
.topnav.dark .nav-links button{color:#C7D3E5}
.topnav.dark .nav-links button:hover{background:rgba(255,255,255,.08);color:#fff}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:11px;
  font-size:13px;font-weight:700;transition:.2s var(--t);
  white-space:nowrap;
}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-50)}
.btn-primary{
  background:linear-gradient(135deg,var(--blue),var(--blue-2));
  color:#fff;box-shadow:0 6px 16px rgba(0,114,206,.35),inset 0 1px 0 rgba(255,255,255,.15);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,114,206,.5)}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#FFCD4A);
  color:var(--navy);box-shadow:0 6px 18px rgba(255,184,28,.35),inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(255,184,28,.5)}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:9px}
.btn-lg{padding:14px 26px;font-size:14.5px;border-radius:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ HERO / LANDING ============ */
.landing{min-height:100vh;background:var(--bg)}
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 20% 0%,rgba(0,114,206,.35),transparent 50%),
    radial-gradient(circle at 100% 100%,rgba(255,184,28,.15),transparent 45%),
    linear-gradient(135deg,#001B41,#00112E 60%,#00091E);
  color:#fff;padding:88px 32px 96px;
}
.hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0);
  background-size:32px 32px;opacity:.6;
}
.hero-inner{position:relative;max-width:1180px;margin:0 auto;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:60px;align-items:center}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr;gap:44px}.hero{padding:56px 22px 64px}}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:24px;font-size:11.5px;font-weight:700;
  background:rgba(255,184,28,.12);border:1px solid rgba(255,184,28,.35);
  color:#FFD166;margin-bottom:22px;letter-spacing:.02em;
}
.hero-badge::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 10px var(--gold);
}
.hero h1{
  font-size:56px;font-weight:800;line-height:1.05;letter-spacing:-.035em;
  margin-bottom:22px;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(120deg,var(--gold),#FFE082);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p.lead{
  font-size:17px;color:#A9BBD6;line-height:1.65;max-width:560px;
  margin-bottom:32px;font-weight:400;
}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.hero-stats{
  display:flex;gap:34px;flex-wrap:wrap;padding-top:26px;
  border-top:1px solid rgba(255,255,255,.08);
}
.hero-stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em}
.hero-stat span{font-size:12px;color:#7A93B8;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
@media(max-width:640px){.hero h1{font-size:38px}.hero p.lead{font-size:15px}}

/* Hero side preview */
.hero-preview{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:22px;
  backdrop-filter:blur(12px);
  box-shadow:0 32px 80px rgba(0,0,0,.4);
  position:relative;
}
.hero-preview::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:20px 20px 0 0;
}
.preview-head{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.preview-head .dot{width:10px;height:10px;border-radius:50%}
.preview-head .dot:nth-child(1){background:#FF5F57}
.preview-head .dot:nth-child(2){background:#FEBC2E}
.preview-head .dot:nth-child(3){background:#28C840}
.preview-head span{font-size:11px;color:#7A93B8;margin-left:auto;font-weight:600;letter-spacing:.05em}
.preview-line{
  display:flex;gap:11px;align-items:flex-start;padding:9px 0;
}
.preview-avatar{
  width:32px;height:32px;border-radius:10px;flex:0 0 32px;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;
}
.preview-bubble{
  flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-radius:4px 12px 12px 12px;padding:9px 13px;
  font-size:13px;color:#E8EEF8;line-height:1.5;
}
.preview-speaker{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;margin-bottom:3px;opacity:.75}
.preview-progress{
  margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-between;align-items:center;
}
.preview-progress b{font-size:12.5px;color:#fff;font-weight:700}
.preview-bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;flex:1;margin:0 12px;overflow:hidden}
.preview-bar div{height:100%;width:65%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:6px}

/* ============ SECTIONS ============ */
.section{padding:88px 32px}
.section-inner{max-width:1180px;margin:0 auto}
.section-head{text-align:center;max-width:680px;margin:0 auto 60px}
.section-eyebrow{
  font-size:11.5px;font-weight:800;letter-spacing:.14em;
  color:var(--blue);text-transform:uppercase;margin-bottom:14px;
}
.section-head h2{
  font-size:40px;font-weight:800;line-height:1.15;letter-spacing:-.03em;
  margin-bottom:16px;color:var(--navy);
}
.section-head p{font-size:16px;color:var(--ink-2);line-height:1.7}
@media(max-width:640px){.section{padding:60px 20px}.section-head h2{font-size:28px}}

/* Feature grid */
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:900px){.feature-grid{grid-template-columns:1fr}}
.feature-card{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:28px;transition:.25s var(--t);
}
.feature-card:hover{
  transform:translateY(-4px);border-color:#CFE0F2;
  box-shadow:var(--shadow-md);
}
.feature-icon{
  width:52px;height:52px;border-radius:14px;
  display:grid;place-items:center;font-size:24px;margin-bottom:18px;
  background:linear-gradient(135deg,var(--blue-50),#E8F3FD);
  border:1px solid var(--line);
}
.feature-card h3{font-size:17px;font-weight:700;margin-bottom:9px;color:var(--navy)}
.feature-card p{font-size:14px;color:var(--ink-2);line-height:1.65}

/* CEFR Levels */
.levels-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:1100px){.levels-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.levels-grid{grid-template-columns:1fr}}
.level-card{
  position:relative;overflow:hidden;
  background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:26px 22px;transition:.25s var(--t);
}
.level-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--level-color),var(--level-color2));
}
.level-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-md);
  border-color:var(--level-color);
}
.level-code{
  display:inline-block;font-size:26px;font-weight:900;letter-spacing:-.03em;
  color:var(--level-color);margin-bottom:6px;
}
.level-name{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:12px}
.level-desc{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:18px;min-height:62px}
.level-meta{
  display:flex;justify-content:space-between;padding-top:14px;
  border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3);font-weight:600;
}
.level-meta b{color:var(--navy);font-weight:700}

/* Pricing */
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
@media(max-width:900px){.pricing-grid{grid-template-columns:1fr;max-width:480px;margin:0 auto}}
.plan{
  position:relative;background:#fff;border:1.5px solid var(--line);
  border-radius:20px;padding:32px 26px;display:flex;flex-direction:column;
  transition:.25s var(--t);
}
.plan:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.plan.featured{
  border-color:var(--blue);border-width:2px;
  box-shadow:var(--shadow-md);
  background:linear-gradient(180deg,#fff,#FAFCFF);
}
.plan.featured::before{
  content:'MÁS POPULAR';
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--gold),#FFCD4A);color:var(--navy);
  padding:5px 14px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.08em;
  box-shadow:0 4px 12px rgba(255,184,28,.4);
}
.plan h3{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px}
.plan .plan-desc{font-size:13px;color:var(--ink-2);margin-bottom:20px;line-height:1.55}
.plan-price{display:flex;align-items:baseline;gap:6px;margin-bottom:22px}
.plan-price .amount{font-size:44px;font-weight:900;letter-spacing:-.04em;color:var(--navy);line-height:1}
.plan-price .currency{font-size:20px;font-weight:700;color:var(--ink-2);align-self:flex-start;margin-top:6px}
.plan-price .period{font-size:13px;color:var(--ink-3);font-weight:600}
.plan ul{list-style:none;margin-bottom:26px;flex:1}
.plan ul li{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13.5px;color:var(--ink-2);padding:7px 0;line-height:1.5;
}
.plan ul li::before{
  content:'✓';color:var(--ok);font-weight:800;flex:0 0 auto;
}
.plan .btn{width:100%;justify-content:center}

/* CTA banner */
.cta-banner{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,184,28,.18),transparent 45%),
    linear-gradient(135deg,#001B41,#00112E);
  color:#fff;border-radius:24px;padding:60px 48px;
  display:flex;align-items:center;justify-content:space-between;gap:32px;
  box-shadow:var(--shadow-lg);
}
@media(max-width:800px){.cta-banner{flex-direction:column;text-align:center;padding:44px 28px}}
.cta-banner h2{font-size:32px;font-weight:800;letter-spacing:-.025em;margin-bottom:10px}
.cta-banner p{font-size:15px;color:#A9BBD6;max-width:520px}
@media(max-width:640px){.cta-banner h2{font-size:24px}}

/* Footer */
.footer{
  background:var(--navy-3);color:#93A8C7;
  padding:52px 32px 32px;
}
.footer-inner{
  max-width:1180px;margin:0 auto;
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;
}
@media(max-width:800px){.footer-inner{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.footer-inner{grid-template-columns:1fr}}
.footer h4{color:#fff;font-size:13px;font-weight:700;margin-bottom:16px;letter-spacing:.03em;text-transform:uppercase}
.footer p,.footer a{font-size:13px;line-height:1.8;color:#93A8C7;display:block;transition:.15s}
.footer a:hover{color:var(--gold)}
.footer-bottom{
  max-width:1180px;margin:40px auto 0;padding-top:26px;
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-between;font-size:12px;flex-wrap:wrap;gap:12px;
}

/* ============ AUTH MODAL ============ */
.modal-backdrop{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,11,30,.6);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px;
}
.modal-backdrop.show{display:flex}
.modal{
  background:#fff;border-radius:22px;max-width:440px;width:100%;
  padding:34px 32px;box-shadow:var(--shadow-lg);
  position:relative;max-height:92vh;overflow-y:auto;
  animation:modalIn .3s var(--t);
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:6px;letter-spacing:-.02em}
.modal .modal-sub{font-size:13.5px;color:var(--ink-2);margin-bottom:24px;line-height:1.55}
.modal-close{
  position:absolute;top:16px;right:16px;
  width:34px;height:34px;border-radius:10px;
  display:grid;place-items:center;font-size:18px;color:var(--ink-3);
  transition:.15s;
}
.modal-close:hover{background:var(--line-2);color:var(--ink)}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px;letter-spacing:.01em}
.field input,.field select{
  width:100%;padding:12px 14px;border-radius:11px;
  border:1.5px solid var(--line);background:#fff;
  font-size:14px;font-weight:500;color:var(--ink);
  outline:none;transition:.18s var(--t);
}
.field input:focus,.field select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(0,114,206,.12);
}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.modal-switch{
  text-align:center;font-size:13px;color:var(--ink-2);margin-top:20px;
  padding-top:20px;border-top:1px solid var(--line-2);
}
.modal-switch a{color:var(--blue);font-weight:700;cursor:pointer}
.modal-switch a:hover{text-decoration:underline}
.alert{
  padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;
  margin-bottom:16px;display:none;
}
.alert.show{display:block}
.alert.err{background:var(--err-bg);color:#A5201A;border:1px solid #F5C6C0}
.alert.ok{background:var(--ok-bg);color:#0A6B3E;border:1px solid #B7E4CA}

/* ============ DASHBOARD ============ */
.app-shell{min-height:100vh;background:var(--bg)}
.dash-hero{
  background:
    radial-gradient(circle at 100% 0%,rgba(255,184,28,.14),transparent 45%),
    linear-gradient(135deg,#001B41,#00112E);
  color:#fff;padding:52px 32px 56px;position:relative;overflow:hidden;
}
.dash-hero::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--gold),transparent);
}
.dash-hero-inner{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.dash-hero h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.dash-hero p{font-size:15px;color:#A9BBD6;max-width:600px}
.dash-kpis{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px;
}
@media(max-width:900px){.dash-kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:18px;backdrop-filter:blur(6px);
}
.kpi .kpi-label{font-size:11px;color:#7A93B8;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px}
.kpi .kpi-value{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff}
.kpi .kpi-value small{font-size:14px;color:#A9BBD6;font-weight:600}

.dash-content{max-width:1180px;margin:0 auto;padding:40px 32px 80px}
@media(max-width:640px){.dash-content{padding:28px 20px 60px}.dash-hero{padding:38px 20px 44px}.dash-hero h1{font-size:26px}}

.dash-tabs{
  display:flex;gap:6px;margin-bottom:32px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.dash-tabs::-webkit-scrollbar{display:none}
.dash-tab{
  padding:12px 18px;font-size:13.5px;font-weight:700;
  color:var(--ink-3);border-bottom:2.5px solid transparent;
  transition:.2s var(--t);white-space:nowrap;
}
.dash-tab:hover{color:var(--blue)}
.dash-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Level cards in dashboard */
.dash-levels{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(max-width:760px){.dash-levels{grid-template-columns:1fr}}
.dash-level{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:24px;position:relative;overflow:hidden;transition:.25s var(--t);
}
.dash-level::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--level-color),var(--level-color2));
}
.dash-level.locked{opacity:.7}
.dash-level:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.dash-level-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.dash-level-code{font-size:30px;font-weight:900;letter-spacing:-.03em;color:var(--level-color)}
.dash-level-name{font-size:14px;font-weight:700;color:var(--navy);margin-top:2px}
.lock-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:20px;font-size:11px;font-weight:800;
  background:var(--line-2);color:var(--ink-3);letter-spacing:.03em;
}
.lock-badge.owned{background:var(--ok-bg);color:#0A6B3E}
.dash-progress{margin-bottom:16px}
.dash-progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.dash-progress-meta b{color:var(--navy);font-weight:800}
.dash-bar{height:8px;background:var(--line-2);border-radius:8px;overflow:hidden}
.dash-bar div{
  height:100%;border-radius:8px;
  background:linear-gradient(90deg,var(--level-color),var(--level-color2));
  transition:width .6s var(--t);
}
.dash-modules{list-style:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.dash-module{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;font-size:13px;color:var(--ink-2);
  border-bottom:1px dashed var(--line-2);
}
.dash-module:last-child{border-bottom:none}
.dash-module .mod-dot{
  width:22px;height:22px;border-radius:50%;flex:0 0 22px;
  display:grid;place-items:center;font-size:11px;font-weight:800;
  background:var(--line-2);color:var(--ink-3);
}
.dash-module.done .mod-dot{background:var(--ok);color:#fff}
.dash-module.done .mod-name{color:var(--ink);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.dash-module .mod-name{flex:1}
.dash-module .mod-btn{
  font-size:11.5px;font-weight:700;color:var(--blue);padding:6px 12px;
  border-radius:8px;background:var(--blue-50);
}
.dash-module .mod-btn:hover{background:var(--blue);color:#fff}

/* ============ COURSE VIEW ============ */
.course-shell{max-width:1180px;margin:0 auto;padding:32px}
.course-header{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  margin-bottom:26px;flex-wrap:wrap;
}
.course-title{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.025em}
.course-subtitle{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.course-layout{display:grid;grid-template-columns:280px 1fr;gap:26px}
@media(max-width:900px){.course-layout{grid-template-columns:1fr}}
{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:18px;position:sticky;top:96px;height:fit-content;
}
.course-side h4{
  font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:12px;
}
.course-side .side-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;
  color:var(--ink-2);cursor:pointer;transition:.15s;margin-bottom:3px;
  width:100%;text-align:left;
}
.course-side .side-item:hover{background:var(--blue-50);color:var(--blue)}
.course-side .side-item.active{background:var(--blue);color:#fff}
.course-side .side-item .si-num{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:var(--line-2);color:var(--ink-3);font-size:11px;font-weight:800;
}
.course-side .side-item.active .si-num{background:rgba(255,255,255,.25);color:#fff}
.course-side .side-item.done .si-num{background:var(--ok);color:#fff}

/* Reuse dialogue styles from before */
.dlg-head{
  background:
    radial-gradient(circle at 100% 0%,rgba(255,184,28,.18),transparent 45%),
    linear-gradient(135deg,#001B41,#00112E);
  border-radius:22px;padding:28px 30px;color:#fff;
  box-shadow:var(--shadow-lg);margin-bottom:22px;position:relative;overflow:hidden;
}
.dlg-head::after{
  content:'';position:absolute;left:0;bottom:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--gold),transparent);
}
.dlg-head h2{font-size:26px;font-weight:800;letter-spacing:-.03em;position:relative;z-index:1}
.dlg-head .sub{font-size:13.5px;color:#A9BBD6;margin-top:5px;position:relative;z-index:1}
.dlg-head .badge{
  display:inline-block;background:rgba(0,114,206,.25);border:1px solid rgba(0,114,206,.4);
  padding:5px 12px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:1px;
  color:#8CC7FF;margin-bottom:12px;text-transform:uppercase;
}
.toolbar{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:22px;box-shadow:var(--shadow);
}
.tool{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);
  transition:.18s var(--t);white-space:nowrap;
}
.tool:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-50)}
.tool.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tool.done{background:var(--ok);border-color:var(--ok);color:#fff}
.tool select{border:none;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:inherit;cursor:pointer;outline:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}

.lines{display:flex;flex-direction:column;gap:16px}
.line{display:flex;gap:13px;align-items:flex-start;animation:fade .4s var(--t) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.avatar{
  width:42px;height:42px;border-radius:13px;flex:0 0 42px;
  display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;
  box-shadow:0 4px 10px rgba(0,27,65,.18),inset 0 1px 0 rgba(255,255,255,.2);
}
.bubble{
  flex:1;background:#fff;border:1px solid var(--line);
  border-radius:6px 18px 18px 18px;padding:14px 18px 13px;
  box-shadow:var(--shadow);position:relative;transition:.25s var(--t);
}
.line.speaking .bubble{border-color:var(--blue);background:linear-gradient(180deg,#F5FAFF,#fff);box-shadow:0 0 0 3px rgba(0,114,206,.12)}
.speaker{font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;margin-bottom:6px}
.text{font-size:15.5px;line-height:1.65;color:#0A1E3D;cursor:pointer;font-weight:400}
.text.hidden{filter:blur(6px);user-select:none;pointer-events:none}
.line-actions{display:flex;gap:6px;margin-top:10px;align-items:center}
.mini{
  border:none;background:var(--blue-50);color:var(--ink-2);
  width:30px;height:30px;border-radius:9px;font-size:13px;
  display:grid;place-items:center;transition:.18s var(--t);
}
.mini:hover{background:var(--blue);color:#fff}
.mini.speaking{background:var(--blue);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.turn-hint{
  font-size:12.5px;color:var(--blue);font-weight:700;font-style:italic;
  background:var(--blue-50);border:1px dashed var(--blue-2);
  border-radius:10px;padding:10px 14px;margin-top:8px;
}

.panel{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:24px 26px;box-shadow:var(--shadow);margin-bottom:20px;
}
.panel h3{font-size:16.5px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;color:var(--navy)}
.panel h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(255,184,28,.18)}
.note{display:flex;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line);font-size:13.8px;line-height:1.68;color:#1E3354}
.note:last-child{border-bottom:none}
.note .n{
  color:var(--blue);font-weight:800;flex:0 0 auto;font-size:13px;
  width:22px;height:22px;border-radius:7px;background:var(--blue-50);
  display:grid;place-items:center;margin-top:1px;
}
.note em{color:var(--blue-2);font-style:italic;font-weight:600;background:var(--blue-50);padding:1px 5px;border-radius:4px}
.phrase{
  display:flex;justify-content:space-between;gap:16px;align-items:center;
  padding:14px 16px;border-radius:12px;
  background:linear-gradient(135deg,#FBFDFF,#F5F9FE);
  border:1px solid var(--line-2);margin-bottom:10px;transition:.2s var(--t);
}
.phrase:hover{background:linear-gradient(135deg,#F3F8FD,#E9F2FC);border-color:#CFE0F2}
.phrase .en{font-size:14.8px;font-weight:600;color:var(--navy);line-height:1.4}
.phrase .es{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.45}
.phrase .say{
  flex:0 0 auto;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--blue);
  font-size:15px;box-shadow:var(--shadow);transition:.18s var(--t);
}
.phrase .say:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.phrase .say.speaking{background:var(--blue);color:#fff;animation:pulse 1s infinite}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn.b1{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;box-shadow:0 6px 16px rgba(0,114,206,.35)}
.btn.b1:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,114,206,.5)}
.btn.b2{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.btn.b2:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-50)}

.cloze-item{
  background:linear-gradient(180deg,#fff,#FBFDFF);
  border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;margin-bottom:13px;box-shadow:var(--shadow);
}
.cloze-item .who{font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.cloze-txt{font-size:15.3px;line-height:2;color:#0A1E3D}
.cloze-txt input{
  border:none;border-bottom:2.5px solid var(--blue);background:var(--blue-50);
  font-family:inherit;font-size:15px;font-weight:700;color:var(--blue-2);
  padding:3px 10px;min-width:130px;outline:none;border-radius:7px 7px 0 0;
  text-align:center;transition:.18s var(--t);
}
.cloze-txt input:focus{background:var(--blue-light)}
.cloze-txt input.ok{border-color:var(--ok);background:var(--ok-bg);color:#0A6B3E}
.cloze-txt input.bad{border-color:var(--err);background:var(--err-bg);color:#A5201A}
.fb{font-size:12.5px;font-weight:600;margin-top:9px;display:none;padding:6px 10px;border-radius:7px}
.fb.show{display:inline-block}
.fb.ok{color:#0A6B3E;background:var(--ok-bg)}
.fb.bad{color:#A5201A;background:var(--err-bg)}

.quiz-card{
  background:#fff;border:1px solid var(--line);border-radius:22px;
  padding:30px 32px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;
}
.quiz-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--blue),var(--gold));
}
.qmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:16px;letter-spacing:.03em;text-transform:uppercase}
.qbar{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden;margin-bottom:24px}
.qbar div{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));width:0;transition:width .4s var(--t)}
.qtext{font-size:22px;font-weight:800;line-height:1.4;margin-bottom:10px;color:var(--navy);letter-spacing:-.025em}
.qsub{font-size:12.5px;color:var(--ink-3);margin-bottom:22px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  text-align:left;padding:15px 18px;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;font-size:14.5px;font-weight:600;color:var(--ink);
  transition:.18s var(--t);display:flex;justify-content:space-between;
  align-items:center;gap:12px;
}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-50)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok);color:#0A6B3E}
.opt.wrong{background:var(--err-bg);border-color:var(--err);color:#A5201A}
.opt .mark{font-weight:900;font-size:16px}

/* ============ TOAST ============ */
.toast-host{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{
  background:var(--navy);color:#fff;padding:14px 18px;border-radius:12px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);
  border-left:3px solid var(--gold);
  animation:toastIn .3s var(--t);max-width:340px;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ============ LOADING / EMPTY ============ */
.empty{text-align:center;padding:60px 20px;color:var(--ink-2)}
.empty .big{font-size:56px;margin-bottom:16px;display:inline-block}
.empty h3{font-size:20px;color:var(--navy);margin-bottom:10px;font-weight:800}
.empty p{font-size:14px;max-width:420px;margin:0 auto 24px;line-height:1.7}

.hidden{display:none!important}

/* ============ RESPONSIVE ============ */
@media(max-width:640px){
  .topnav{padding:0 16px;height:64px}
  .nav-links{display:none}
  .topnav .nav-links.show-mobile{
    display:flex;position:absolute;top:64px;left:0;right:0;
    background:#fff;border-bottom:1px solid var(--line);
    flex-direction:column;padding:12px;
  }
}
  /* ============================================================
   RESPONSIVE · DRAWER DE MÓDULOS EN MÓVIL
   ============================================================ */

/* Botón flotante: solo aparece en móvil */
.course-side-toggle{
  display:none;
  position:fixed;bottom:22px;left:22px;z-index:80;
  background:linear-gradient(135deg,var(--blue),var(--blue-2));
  color:#fff;border-radius:50%;width:56px;height:56px;
  font-size:22px;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,114,206,.45),inset 0 1px 0 rgba(255,255,255,.2);
  transition:.2s var(--t);
  border:none;cursor:pointer;
}
.course-side-toggle:hover{transform:scale(1.06)}
.course-side-toggle:active{transform:scale(.98)}

/* Backdrop detrás del drawer */
.course-side-backdrop{
  display:none;
  position:fixed;inset:0;z-index:75;
  background:rgba(0,17,46,.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.course-side-backdrop.show{display:block;animation:fadeBack .25s ease}
@keyframes fadeBack{from{opacity:0}to{opacity:1}}

/* Cabecera del sidebar con botón cerrar */
.course-side-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.course-side-close{
  display:none;width:30px;height:30px;border-radius:9px;
  background:var(--line-2);color:var(--ink-2);font-size:16px;
  align-items:center;justify-content:center;
  border:none;cursor:pointer;transition:.15s;
}
.course-side-close:hover{background:var(--err-bg);color:var(--err)}

/* Ajustes adicionales del sidebar (por si acaso) */
.course-side{
  max-height:calc(100vh - 120px);
  overflow-y:auto;
}
.course-side::-webkit-scrollbar{width:6px}
.course-side::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ============ MÓVIL ============ */
@media(max-width:900px){
  .course-layout{grid-template-columns:1fr;gap:0}

  /* Sidebar como drawer deslizante */
  .course-side{
    position:fixed;top:0;left:0;bottom:0;
    width:min(320px,86vw);
    border-radius:0;border:none;border-right:1px solid var(--line);
    padding:22px 18px;
    z-index:80;
    max-height:100vh;
    transform:translateX(-100%);
    transition:transform .3s var(--t);
    box-shadow:6px 0 32px rgba(0,17,46,.15);
    overflow-y:auto;
    background:#fff;
  }
  .course-side.open{transform:translateX(0)}
  .course-side-toggle{display:flex}
  .course-side-close{display:flex}

  /* Ajustes de espaciado */
  .course-shell{padding:20px 16px 100px}
  .course-header{margin-bottom:18px}
  .dlg-head{padding:22px 20px;border-radius:18px}
  .dlg-head h2{font-size:20px}
  .dlg-head .sub{font-size:12.5px}
  .toolbar{padding:11px 13px;gap:7px}
  .tool{padding:8px 12px;font-size:12px}
  .sep{display:none}

  .bubble{padding:12px 14px}
  .text{font-size:14.6px;line-height:1.6}
  .avatar{width:36px;height:36px;flex-basis:36px;font-size:12px;border-radius:11px}

  .panel{padding:18px 18px}
  .panel h3{font-size:15px}
  .note{font-size:13.4px}
  .phrase{padding:12px 13px}
  .phrase .en{font-size:14px}
  .phrase .es{font-size:12.5px}

  .quiz-card{padding:22px 20px;border-radius:18px}
  .qtext{font-size:18px}
  .opt{padding:13px 15px;font-size:13.8px}
}

@media(max-width:480px){
  .course-shell{padding:16px 12px 100px}
  .dlg-head{padding:18px 16px}
  .dlg-head h2{font-size:18px}
  .bubble{padding:11px 13px}
  .text{font-size:14px}
  .avatar{width:34px;height:34px;flex-basis:34px}
  .tool{padding:7px 10px;font-size:11.5px}
} 

  
/* ============================================================
   PANEL STYLE
   ============================================================ */
.admin-hero{
  background:
    radial-gradient(circle at 100% 0%,rgba(255,184,28,.15),transparent 45%),
    radial-gradient(circle at 0% 100%,rgba(0,114,206,.25),transparent 50%),
    linear-gradient(135deg,#001B41,#00112E);
  color:#fff;padding:48px 32px 52px;position:relative;overflow:hidden;
}
.admin-hero::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--gold),transparent);
}
.admin-hero-inner{max-width:1240px;margin:0 auto;position:relative;z-index:1}
.admin-hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.admin-hero p{font-size:14.5px;color:#A9BBD6}
.admin-kpis{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px;
}
@media(max-width:1000px){.admin-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.admin-kpis{grid-template-columns:1fr}}

.admin-content{max-width:1240px;margin:0 auto;padding:32px 32px 80px}
@media(max-width:640px){.admin-content{padding:22px 16px 60px}.admin-hero{padding:32px 18px 36px}.admin-hero h1{font-size:22px}}

.admin-tabs{
  display:flex;gap:6px;margin-bottom:28px;
  border-bottom:1px solid var(--line);overflow-x:auto;
}
.admin-tab{
  padding:12px 18px;font-size:13.5px;font-weight:700;
  color:var(--ink-3);border-bottom:2.5px solid transparent;
  transition:.2s var(--t);white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;
  cursor:pointer;font-family:inherit;
}
.admin-tab:hover{color:var(--blue)}
.admin-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Charts */
.chart-grid{
  display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-bottom:22px;
}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
.chart-card{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:22px 24px;box-shadow:var(--shadow);
}
.chart-card h3{
  font-size:14px;font-weight:800;color:var(--navy);
  margin-bottom:6px;letter-spacing:-.01em;
}
.chart-card .chart-sub{
  font-size:12px;color:var(--ink-3);margin-bottom:20px;font-weight:500;
}
.bar-row{
  display:flex;align-items:center;gap:12px;margin-bottom:11px;
}
.bar-label{
  flex:0 0 92px;font-size:12.5px;font-weight:700;color:var(--ink-2);
  display:flex;align-items:center;gap:7px;
}
.bar-label .dot{
  width:8px;height:8px;border-radius:50%;flex:0 0 8px;
}
.bar-track{
  flex:1;height:22px;background:var(--line-2);border-radius:8px;
  overflow:hidden;position:relative;
}
.bar-fill{
  height:100%;border-radius:8px;
  transition:width .8s var(--t);
  display:flex;align-items:center;padding-left:9px;
  color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em;
  min-width:fit-content;
}
.bar-value{
  flex:0 0 60px;text-align:right;font-size:12.5px;
  font-weight:700;color:var(--ink-2);
}

/* Users table */

  /* ============================================================
   BOTÓN FLOTANTE DE WHATSAPP
   ============================================================ */
.wa-float{
  position:fixed;
  bottom:24px;right:24px;
  z-index:70;
  display:flex;align-items:center;gap:10px;
  text-decoration:none;
  animation:waIn .5s var(--t) both;
}
@keyframes waIn{
  from{opacity:0;transform:translateY(20px) scale(.85)}
  to{opacity:1;transform:none}
}

.wa-btn{
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#25D366,#1EBE5D);
  display:grid;place-items:center;
  box-shadow:
    0 8px 24px rgba(37,211,102,.4),
    0 4px 12px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.25);
  transition:.2s var(--t);
  position:relative;
  cursor:pointer;
  border:none;
}
.wa-btn:hover{transform:scale(1.08) rotate(4deg)}
.wa-btn:active{transform:scale(.96)}

.wa-btn svg{
  width:30px;height:30px;fill:#fff;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));
}

/* Pulso sutil */
.wa-btn::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid #25D366;opacity:0;
  animation:waPulse 2.5s var(--t) infinite;
}
@keyframes waPulse{
  0%{transform:scale(1);opacity:.7}
  100%{transform:scale(1.35);opacity:0}
}

/* Tooltip */
.wa-tooltip{
  background:#fff;color:var(--navy);
  padding:10px 16px;border-radius:12px;
  font-size:13px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,27,65,.15);
  white-space:nowrap;
  position:relative;
  opacity:0;
  transform:translateX(8px);
  transition:.25s var(--t);
  pointer-events:none;
  border:1px solid var(--line);
}
.wa-tooltip::after{
  content:'';position:absolute;right:-6px;top:50%;
  transform:translateY(-50%) rotate(45deg);
  width:12px;height:12px;background:#fff;
  border-right:1px solid var(--line);
  border-top:1px solid var(--line);
}
.wa-float:hover .wa-tooltip{
  opacity:1;transform:translateX(0);
}

/* Mostrar tooltip automáticamente tras 3s (primera vez) */
.wa-float.show-tip .wa-tooltip{
  opacity:1;transform:translateX(0);
}

/* Ocultar en modales abiertos */
body.modal-open .wa-float{
  opacity:0;pointer-events:none;transform:translateY(12px);
}
@media(max-width:900px){
  .wa-tooltip{display:none}
}

/**
 * Construye el mensaje final según contexto y usuario.
 * Exporta también la función que genera la URL.
 */
function buildWhatsAppMessage(context = 'landing', user = null){
  const ctxLabel = WHATSAPP_CONFIG.contextLabels[context] || 'información';

  // LOG TEMPORAL: confirma que el usuario llega aquí
  console.log('[WA] buildWhatsAppMessage → context:', context, '| user:', user ? user.name : 'NULL');

  if(!user){
    return WHATSAPP_CONFIG.messages[context] || WHATSAPP_CONFIG.messages.landing;
  }

  const levels = Object.entries(user.levels || {})
    .filter(([, v]) => v)
    .map(([k]) => k.toUpperCase())
    .join(', ') || 'ninguno';

  const dialogue = UI.currentDialogue
    ? DIALOGUES.find(d => d.id === UI.currentDialogue)
    : null;

  const lines = [
    'Hola,',
    '',

    `Email: ${user.email || 'sin email'}`,
    `ID: ${user.id || 'sin id'}`,
    `Niveles activos: ${levels}`
  ];

  if(dialogue){
    lines.push(`Viendo ahora: ${dialogue.title} (${dialogue.level.toUpperCase()})`);
  }

  async signIn(email, password){
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

async getTeacherStats(teacherId){
  const students = await this.getTeacherStudents(teacherId);
  const dialoguesByLevel = { b1:[], b2:[], c1:[], c2:[] };
  DIALOGUES.forEach(d => dialoguesByLevel[d.level]?.push(d.id));

  if(!students.length){
    return {
      totalStudents: 0, newThisWeek: 0, totalCompleted: 0, avgAccuracy: 0,
      levelOwners: {b1:0,b2:0,c1:0,c2:0},
      levelCompletions: {b1:0,b2:0,c1:0,c2:0},
      dialoguesByLevel, recentActivity: [], students: [], progressByUser: {}
    };
  }

  const studentIds = students.map(s => s.id);
  const { data: progress } = await supabaseClient
    .from('progress').select('*').in('user_id', studentIds);

  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const newThisWeek = students.filter(s =>
    new Date(s.created_at).getTime() > weekAgo
  ).length;

  let totalCompleted = 0, totalQuizScore = 0, totalQuizTotal = 0;
  const levelOwners = {b1:0,b2:0,c1:0,c2:0};
  const levelCompletions = {b1:0,b2:0,c1:0,c2:0};
  const progressByUser = {};

  students.forEach(s => {
    progressByUser[s.id] = { completed: [], quizScores: [] };
    Object.keys(levelOwners).forEach(k => { if(s.levels?.[k]) levelOwners[k]++; });
  });

  (progress || []).forEach(r => {
    if(!progressByUser[r.user_id]) return;
    if(r.completed){
      progressByUser[r.user_id].completed.push(r.dialogue_id);
      totalCompleted++;
      const d = DIALOGUES.find(x => x.id === r.dialogue_id);
      if(d && levelCompletions[d.level] !== undefined) levelCompletions[d.level]++;
    }
    if(r.quiz_total > 0){
      progressByUser[r.user_id].quizScores.push({
        dialogueId: r.dialogue_id, score: r.quiz_score, total: r.quiz_total
      });
      totalQuizScore += r.quiz_score;
      totalQuizTotal += r.quiz_total;
    }
  });

  const recentActivity = students
    .map(s => ({ user: s, progress: progressByUser[s.id] }))
    .sort((a,b) => new Date(b.user.created_at) - new Date(a.user.created_at))
    .slice(0, 8);

  return {
    totalStudents: students.length,
    newThisWeek,
    totalCompleted,
    avgAccuracy: totalQuizTotal ? Math.round(totalQuizScore/totalQuizTotal*100) : 0,
    levelOwners,
    levelCompletions,
    dialoguesByLevel,
    recentActivity,
    students,
    progressByUser
  };

async createStudentFromAdmin({ name, email, password, teacherId, levels }){
  // 1. Crear el usuario en Auth
  const { data: authData, error: authError } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      data: { name, role: 'student', teacher_id: teacherId || '' },
      emailRedirectTo: window.location.origin
    }
  });

  if(authError) throw new Error(authError.message);
  if(!authData.user) throw new Error('No se pudo crear el usuario');

  const userId = authData.user.id;

  // 2. Actualizar el perfil con los niveles y teacher_id
  // (el trigger ya creó el perfil con valores por defecto)
  const patch = {};
  if(teacherId) patch.teacher_id = teacherId;
  if(levels && Object.keys(levels).length) patch.levels = levels;

  if(Object.keys(patch).length){
    const { error: profileError } = await supabaseClient
      .from('profiles')
      .update(patch)
      .eq('id', userId);
    if(profileError) console.warn('[bulk] Error actualizando perfil:', profileError.message);
  }

  return { id: userId, email, name };
},

/* ---------- Traducción de errores de Supabase ---------- */
function traduceError(msg){
  const m = msg.toLowerCase();
  if(m.includes('invalid login')) return 'Email o contraseña incorrectos.';
  if(m.includes('already registered') || m.includes('already been registered'))
    return 'Ya existe una cuenta con ese email.';
  if(m.includes('password') && m.includes('short'))
    return 'La contraseña debe tener al menos 6 caracteres.';
  if(m.includes('email') && m.includes('invalid'))
    return 'El email no es válido.';
  if(m.includes('rate limit'))
    return 'Demasiados intentos. Espera unos minutos.';
  return msg;
}

  title:'The Art of Small Talk',

  text:`Small talk is the informal conversation we have with people we don't know well. It can happen at a party, in an elevator, at a bus stop, or in a waiting room. Although it may seem unimportant, small talk plays a crucial role in building relationships and creating a sense of community.

    reading:{
  title:'The Art of Formal Introductions',

  text:`Formal introductions are an important part of professional and social life. Whether you are at a business meeting, a conference, or a formal dinner, knowing how to introduce yourself and others properly can make a lasting impression.

When introducing two people to each other, there are some conventions to follow. Typically, you introduce the younger person to the older person, the lower-ranking person to the higher-ranking person, and the person you know less well to the person you know better. For example, you might say: "Professor Smith, I'd like you to meet my colleague, Sarah Johnson. Sarah, this is Professor Smith, our department head."

The language used in formal introductions is also different. Phrases like "It's a pleasure to meet you," "How do you do?", and "I'm honored to meet you" are common in formal contexts. In contrast, "Nice to meet you" and "Hi" are more appropriate for informal situations.

Body language is just as important as words. A firm handshake, direct eye contact, and a genuine smile convey confidence and respect. In some cultures, a slight bow or a nod of the head is also appropriate.

Finally, it is important to remember names. When someone introduces themselves, repeat their name to help you remember it: "It's nice to meet you, Dr. Smith." This also shows that you are paying attention.

In conclusion, formal introductions are a valuable skill that can open doors in both professional and social settings. By mastering the conventions of formal introductions, you can make a positive and lasting impression on the people you meet.`,

    reading:{
  title:'The Importance of Being on Time',

  text:`Punctuality is the habit of being on time. In many cultures, it is considered a sign of respect and professionalism. Being late, on the other hand, can be seen as rude or careless. But attitudes toward time vary widely around the world.

In other cultures, such as those in Latin America, Southern Europe, and the Middle East, time is viewed more flexibly. A meeting scheduled for 10:00 might not start until 10:15 or later, and this is not considered a problem. In these cultures, relationships and conversation are often valued more than strict adherence to schedules.

In the United States, punctuality is generally important, especially in business settings. Arriving late for a job interview or a business meeting can seriously damage your reputation. However, social gatherings are often more relaxed, and guests may arrive anytime within a certain window.

Technology has changed the way we think about time. With smartphones and digital calendars, it is easier than ever to keep track of appointments and reminders. But it has also created a culture of constant availability, where people are expected to respond to messages immediately, at any time of day.

In conclusion, punctuality is not just about following rules. It is about respecting other people's time and showing that you value their presence. Whether you are in a culture that values strict punctuality or one that is more relaxed, being aware of these differences can help you avoid misunderstandings and build better relationships.`,

    reading:{
  title:'Telephone Etiquette',
  words: 290,
  minutes: 3,
  text:`Telephone etiquette refers to the rules of polite behavior when making or receiving phone calls. Although the telephone has been around for over a century, the way we use it has changed dramatically in recent years, especially with the rise of mobile phones and video calls.

When making a call, it is polite to introduce yourself first. Instead of saying "Who is this?", you should say "Hello, this is [your name]." If you are calling a business, you might say "Good morning, this is [your name] calling from [your company]." This helps the person on the other end know who they are speaking to.

When receiving a call, answer promptly. If you can't answer, let it go to voicemail and call back as soon as possible. When you call back, apologize for the delay: "I'm sorry I missed your call. How can I help you?"

During the call, it's important to listen actively and not interrupt. If you don't understand something, ask for clarification: "Could you repeat that, please?" or "Could you speak a little slower?"

One of the most important rules of telephone etiquette is to be mindful of the other person's time. Don't make calls late at night unless it's an emergency. Don't call during meals or other personal time unless you have a good reason. And if you're in a public place, keep your voice down so you don't disturb others.

Texting has also changed telephone etiquette. Many people prefer to text rather than call, especially for quick questions or updates. But texting has its own rules: don't text while driving, don't send multiple messages in a row, and don't expect an immediate response.

    text:`Hobbies are activities we do for pleasure during our free time. They can be anything from reading and painting to hiking and cooking. Having a hobby is important for our physical and mental health.

Second, hobbies can improve our skills. Learning to play a musical instrument, speak a new language, or cook a new dish requires practice and patience. These activities keep our brains active and help us grow as individuals.

Third, hobbies connect us with other people. Joining a club, taking a class, or participating in a group activity allows us to meet new people who share our interests. This can lead to lasting friendships.

Finally, hobbies give us a sense of achievement. Completing a painting, finishing a book, or winning a game gives us satisfaction and confidence.

  reading:{
    title:'Staying Healthy',
    words: 300,
    minutes: 3,
    text:`Staying healthy is important for everyone, but it is not always easy. Modern life is busy, and many people forget to take care of their bodies and minds.

One of the most important things you can do for your health is to eat a balanced diet. This means eating fruits, vegetables, whole grains, and proteins every day, and avoiding too much sugar and fat. Drinking enough water is also essential. Most doctors recommend drinking at least eight glasses of water a day.

Exercise is another key part of staying healthy. You don't need to go to the gym every day; even a 30-minute walk can make a big difference. Exercise helps control weight, strengthens the heart, and improves mood.

Sleep is equally important. Adults need between seven and nine hours of sleep every night. Lack of sleep can cause many problems, including difficulty concentrating, mood changes, and a weaker immune system.

Finally, mental health is just as important as physical health. Taking time to relax, talking to friends and family, and asking for help when needed are all part of a healthy lifestyle.

Remember: small changes can make a big difference. Start today!`,

  reading:{
    title:'The Joy of Travel',
    words: 310,
    minutes: 3,
    text:`Traveling is one of the most rewarding experiences a person can have. It allows us to discover new places, meet people from different cultures, and learn about the world beyond our daily lives.

There are many reasons why people travel. Some travel for business, others for pleasure, and many travel to visit family and friends. Whatever the reason, traveling can change the way we see the world.

One of the greatest benefits of travel is personal growth. When we travel, we face new situations and challenges. We learn to be more independent, flexible, and open-minded. We also learn to appreciate what we have at home.

Traveling also helps us understand other cultures. Trying new food, listening to different music, and learning a few words in another language can be exciting and educational. It reminds us that, despite our differences, we are all human.

     minutes: 4,
     text:`In many countries around the world, the population is getting older. This means that there are more elderly people and fewer young people. This change is called population aging, and it has important consequences for society.

     One reason for population aging is that people are living longer. Thanks to better healthcare, nutrition, and living conditions, people today can expect to live many years longer than their grandparents did. Another reason is that families are having fewer children. In many countries, the birth rate has dropped significantly in recent decades.

     Population aging affects many aspects of life. For example, it puts pressure on healthcare systems, because older people usually need more medical care. It also affects the economy, because there are fewer young workers to support the retired population. Some countries are responding by raising the retirement age or encouraging immigration.

     However, population aging is not only a challenge. Older people have valuable experience and knowledge that they can share with younger generations. Many older people continue to work, volunteer, or help care for their grandchildren. They are an important part of society.

     Societies need to adapt to this new reality. This means designing cities that are accessible to people of all ages, creating jobs for older workers, and developing social programs that support both the young and the old.`,

    reading:{
  title:'Multiple Intelligences',
  words: 320,
  minutes: 4,
  text:`For many years, people believed that intelligence was a single ability that could be measured by IQ tests. However, in the 1980s, a psychologist named Howard Gardner proposed a different idea: the theory of multiple intelligences.

According to Gardner, there are several different types of intelligence, and each person has a unique combination of them. Some people are strong in linguistic intelligence, which involves reading, writing, and speaking. Others are strong in logical-mathematical intelligence, which involves numbers, logic, and problem-solving.

There are also other types of intelligence. Musical intelligence is the ability to understand and create music. Spatial intelligence involves visualizing the world in three dimensions and is common among artists and architects. Bodily-kinesthetic intelligence is the ability to use your body skillfully, as athletes and dancers do.

Interpersonal intelligence is the ability to understand and communicate with other people. Intrapersonal intelligence is the ability to understand yourself. Finally, naturalistic intelligence is the ability to recognize and classify plants, animals, and other aspects of the natural world.

Gardner's theory has had a big impact on education. Many schools now try to identify each student's strengths and help them develop in different areas. Instead of asking "How smart are you?", they ask "How are you smart?"

This theory reminds us that everyone has unique talents. Success is not only about academic achievement; it is also about discovering what you love and developing your own abilities.`,

  text:`The performing arts, including theater, dance, and music, have been an essential part of human culture for thousands of years. From ancient Greek tragedies to modern Broadway musicals, people have always been drawn to live performances.

Why do we love the performing arts so much? One reason is that they allow us to experience emotions we might not feel in our daily lives. A good play can make us laugh, cry, or think deeply about important issues. It can transport us to another time or place.

Another reason is that the performing arts bring people together. When we sit in a theater with hundreds of strangers, we share a common experience. We laugh at the same jokes, feel the same tension, and applaud at the same moments. This shared experience creates a sense of community.

The performing arts also have educational benefits. Studies have shown that students who participate in theater or music programs develop better communication skills, greater self-confidence, and improved academic performance. They learn to work as a team, manage their time, and express themselves creatively.

In recent years, the performing arts have faced new challenges. The COVID-19 pandemic forced theaters to close, and many artists struggled to make a living. However, the arts community showed incredible resilience, creating online performances and finding new ways to connect with audiences.

As we look to the future, it is clear that the performing arts will continue to play an important role in our lives. They remind us of our shared humanity and help us understand ourselves and each other better.`,

    reading:{
  title:'The Art of Persuasion',
  words: 330,
  minutes: 4,
  text:`Every day, we are exposed to persuasive messages. Advertisements try to convince us to buy products, politicians try to win our votes, and friends try to persuade us to try new restaurants or watch new movies. Persuasion is a fundamental part of human communication.

But what makes someone persuasive? Researchers have identified several key factors. One of the most important is credibility. People are more likely to be persuaded by someone they trust and respect. This is why companies use celebrities in their advertisements; we trust these famous people, so we trust their recommendations.

Another factor is emotional appeal. Many persuasive messages appeal to our emotions rather than our logic. A charity might show images of hungry children to encourage donations. An advertisement might use humor to make us feel good about a product. Emotions can be powerful motivators.

Logical arguments are also important. When we present facts, statistics, and clear reasoning, we give our audience reasons to agree with us. However, logic alone is not always enough. People are not purely rational beings; our decisions are influenced by both reason and emotion.

The way a message is presented also matters. A message that is clear, well-organized, and easy to understand is more persuasive than a confusing one. Repetition can also be effective; the more we hear a message, the more likely we are to believe it.

Finally, timing and context matter. A message that works in one situation may fail in another. Understanding your audience and adapting your message to their needs is the key to successful persuasion.

In the end, persuasion is not about manipulation. It is about communication: helping others understand your point of view and consider it carefully.`,

    reading:{
  title:'The Science of Happiness',

  minutes: 4,
  text:`What makes people happy? This question has fascinated philosophers, psychologists, and scientists for centuries. In recent decades, researchers have begun to study happiness scientifically, and their findings are surprising.

One of the most important discoveries is that happiness is not primarily about money or material possessions. Studies have shown that once people have enough money to meet their basic needs, additional wealth does not significantly increase their happiness. What matters more are relationships, health, and a sense of purpose.

Relationships are a key factor in happiness. People who have strong social connections—with family, friends, or community—tend to be happier and healthier than those who are isolated. Spending time with loved ones, helping others, and participating in social activities all contribute to well-being.

Another important factor is gratitude. Research has shown that people who regularly practice gratitude—by writing down things they are thankful for or expressing appreciation to others—report higher levels of happiness. Gratitude helps us focus on what we have rather than what we lack.

Physical activity also plays a role. Exercise releases chemicals in the brain, such as endorphins, that make us feel good. Even a short walk can improve mood and reduce stress.

Finally, having a sense of purpose is essential. Whether it comes from work, volunteering, hobbies, or caring for others, having something meaningful to do gives our lives direction and satisfaction.

Of course, happiness is not something we can achieve once and keep forever. It is a continuous process that requires effort and attention. But the good news is that small changes in our daily habits can make a big difference.

In the end, happiness is not a destination. It is a way of life.`,

    text:`The Age of Exploration was a period in history, from the 15th to the 17th century, when European sailors explored the world by sea. During this time, explorers discovered new continents, new trade routes, and new cultures.

One of the most famous explorers was Christopher Columbus, who sailed across the Atlantic Ocean in 1492. He was looking for a new route to Asia, but instead he reached the Americas. This discovery changed the world forever.

Another important explorer was Ferdinand Magellan. In 1519, he led the first expedition to sail around the world. Although Magellan himself died during the journey, his crew completed the trip three years later.

Why did these explorers risk their lives? There were several reasons. Some wanted to find new trade routes to Asia for spices and silk. Others wanted to spread their religion. Many simply wanted adventure and glory.

The Age of Exploration had a huge impact on the world. It connected different continents and led to the exchange of goods, ideas, and people. Unfortunately, it also brought diseases and violence to many native populations.

Today, we can still learn from these explorers. They remind us of the human desire to discover, to explore, and to understand the world around us.`,

  reading:{
    title:'The Digital Revolution',
    words: 330,
    minutes: 4,
    text:`In just a few decades, digital technology has transformed almost every aspect of our lives. We use smartphones to communicate, computers to work, and the internet to access information from anywhere in the world. This digital revolution has brought enormous benefits, but it has also created new challenges.

On the positive side, digital technology has made communication faster and easier than ever before. We can send messages to friends on the other side of the world in seconds, video-call family members, and share photos and ideas instantly. Social media has connected billions of people, allowing us to build communities around shared interests.

Digital technology has also revolutionized education and work. Online courses and tutorials make learning accessible to anyone with an internet connection. Remote work has become common, allowing people to work from home and have more flexible schedules. Many companies now operate globally, hiring talent from anywhere in the world.

However, the digital revolution has its downsides. One major concern is privacy. Every time we use the internet, we leave a digital footprint—data about our habits, preferences, and personal information. Companies and governments can collect and use this data in ways we may not fully understand.

Another concern is the impact on mental health. Studies have linked excessive social media use to increased rates of anxiety and depression, especially among young people. The constant need to check notifications and compare ourselves to others can be exhausting.

Finally, there is the issue of digital divide. While many people enjoy the benefits of digital technology, billions of people around the world still lack access to the internet. This gap between the connected and the disconnected is a major challenge for the future.

The digital revolution is not going away. Our task is to harness its benefits while minimizing its risks.`,

    title:'Protecting Our Planet',

    minutes: 4,
    text:`The Earth is facing an environmental crisis. Climate change, deforestation, pollution, and the loss of biodiversity are just some of the challenges we must address. Scientists warn that without urgent action, the consequences could be catastrophic.

Climate change is perhaps the most pressing issue. The burning of fossil fuels—coal, oil, and gas—releases greenhouse gases into the atmosphere, trapping heat and raising global temperatures. This leads to rising sea levels, more extreme weather events, and the displacement of millions of people.

Deforestation is another serious problem. Forests absorb carbon dioxide and provide habitat for countless species. When forests are destroyed for agriculture or development, we lose these benefits and contribute to climate change. The Amazon rainforest, often called the "lungs of the Earth," has lost vast areas in recent decades.

Pollution affects both the environment and human health. Plastic waste fills our oceans, harming marine life. Air pollution in cities causes respiratory diseases. Chemicals from agriculture contaminate water supplies.

The loss of biodiversity is equally alarming. Scientists estimate that species are going extinct at a rate 1,000 times higher than the natural background rate. Each species plays a role in the ecosystem, and their loss can have cascading effects.

However, there is still hope. Renewable energy sources like solar and wind power are becoming cheaper and more widespread. Many countries have committed to reducing emissions and protecting natural habitats. Individuals can also make a difference by consuming less, recycling, and supporting sustainable businesses.

The future of our planet depends on the choices we make today.`,

  reading:{
    title:'The Future of Education',
    words: 340,
    minutes: 4,
    text:`Education is one of the most important aspects of human life. It shapes who we are, what we can achieve, and how we understand the world. In recent years, the way we learn has changed dramatically, and the future of education promises to be even more different.

One of the biggest changes is the rise of online learning. Online courses, tutorials, and entire degree programs are now available to anyone with an internet connection. Platforms like Coursera, edX, and Khan Academy offer free or low-cost courses from top universities. This democratization of education has made learning accessible to people who previously could not afford it or who live in remote areas.

Technology has also transformed the classroom experience. Interactive whiteboards, educational apps, and virtual reality are being used to make learning more engaging. Students can visit historical sites, explore the human body, or conduct science experiments—all from their desks. Artificial intelligence is being used to personalize learning, adapting to each student's needs and pace.

However, technology is not a magic solution. Research shows that the quality of teaching, the support of parents, and the motivation of students are still the most important factors in learning. A great teacher with a simple chalkboard can be more effective than a mediocre teacher with the latest technology.

Another trend is the shift towards lifelong learning. In a rapidly changing world, the skills we learn in school may become obsolete in a few years. People need to continue learning throughout their lives, whether through formal education, online courses, or self-study.

The future of education will likely combine the best of traditional and modern approaches. Face-to-face interaction remains valuable, but technology can enhance and expand it. The goal is to create learning experiences that are effective, engaging, and accessible to everyone.`,

    title:'The Importance of Cultural Traditions',

    text:`Cultural traditions are the customs, beliefs, and practices that are passed down from generation to generation. They shape our identities, connect us to our history, and give us a sense of belonging. In a rapidly changing world, preserving cultural traditions has become more important than ever.

Every culture has its own unique traditions. In Japan, the tea ceremony is a ritual that emphasizes harmony, respect, and mindfulness. In India, Diwali, the festival of lights, celebrates the victory of light over darkness. In many African cultures, storytelling is a way to pass on wisdom and values to younger generations. These traditions are not just customs; they are expressions of cultural identity.

Traditions also provide comfort and stability during difficult times. When we celebrate a holiday, participate in a religious ceremony, or share a traditional meal with family, we feel connected to something larger than ourselves. This connection can be especially important during periods of change or loss.

However, cultural traditions are not static. They evolve over time, adapting to new circumstances while retaining their essential meaning. For example, many traditional festivals are now celebrated online or shared through social media, allowing people to stay connected even when they are far from home.

Globalization has brought cultures closer together, but it has also raised concerns about cultural homogenization. When dominant cultures spread around the world, local traditions can be lost. This is why it is important to actively preserve and promote cultural diversity.

Understanding and respecting other cultures is essential in our interconnected world. By learning about traditions different from our own, we can build bridges of empathy and understanding. And by celebrating our own traditions, we keep them alive for future generations.

In the end, cultural traditions remind us of our shared humanity and the rich diversity of the human experience.`,

  reading:{
  title:'The Scientific Method',

  minutes: 5,
  text:`The scientific method is a systematic approach to acquiring knowledge about the natural world. It has been the foundation of scientific inquiry for centuries, and it has led to some of the most important discoveries in human history.

The scientific method begins with observation. Scientists observe a phenomenon and ask questions about it. For example, a biologist might observe that certain plants grow faster in sunlight than in shade. From this observation, the scientist formulates a hypothesis—a tentative explanation that can be tested through experimentation.

The next step is experimentation. Scientists design experiments to test their hypotheses, carefully controlling variables to ensure that the results are reliable. In the plant example, the scientist might grow identical plants under different light conditions, measuring their growth over time. If the results support the hypothesis, the scientist may conduct further experiments to confirm the findings.

If the results are consistent across multiple experiments, the hypothesis may become a theory—a well-substantiated explanation of some aspect of the natural world. However, even theories are not absolute; they can be revised or replaced if new evidence emerges. This is a fundamental principle of science: knowledge is always provisional, subject to revision based on new evidence.

The scientific method is not limited to the natural sciences. It can be applied to social sciences, medicine, engineering, and many other fields. Its core principles—observation, hypothesis, experimentation, and revision—are universal.

However, the scientific method is not without limitations. It requires resources, time, and expertise. It may not be suitable for studying certain phenomena that cannot be controlled or replicated. Moreover, the interpretation of results is not always straightforward; scientists must be careful to avoid bias and to consider alternative explanations.

Despite these limitations, the scientific method remains the most reliable way we have of understanding the world. It is a testament to human curiosity and our relentless pursuit of knowledge.`,

  text:`The role of government in society is one of the oldest and most debated questions in political philosophy. Should governments intervene in the economy? How much should they regulate individual behavior? What responsibilities do they have toward their citizens? These questions have no easy answers, and different societies have answered them in different ways.

One view, often associated with classical liberalism, holds that government should be limited. According to this perspective, individuals are best left to pursue their own interests, and the free market is the most efficient way to allocate resources. Government intervention, in this view, often does more harm than good.

Another view, associated with social democracy, argues that government has a responsibility to ensure that all citizens have access to basic goods and services, such as healthcare, education, and a social safety net. According to this perspective, the free market alone cannot address inequality and social problems, and government must play an active role.

A third view, often associated with authoritarian systems, holds that government should have extensive control over society, including the economy, the media, and individual behavior. This view is based on the belief that a strong central authority is necessary for social order and stability.

Most modern societies adopt a mixed approach, combining elements of these different views. They have market economies but also strong social programs. They protect individual freedoms but also regulate certain behaviors for the public good.

The debate over the role of government is unlikely to be resolved. What matters is that citizens engage in this debate, understand the trade-offs involved, and hold their governments accountable. A healthy democracy depends on an informed and engaged citizenry.

In the end, the role of government is not a question of ideology but of pragmatism. What works best for a particular society, at a particular time, depends on many factors, including its history, culture, and economic conditions.`,

  title:'The Art of Negotiation',

  minutes: 5,
  text:`Negotiation is the process by which two or more parties with different interests reach an agreement. It is a fundamental skill in business, diplomacy, and everyday life. Whether you are negotiating a salary, a contract, or a peace treaty, the principles are similar.

Effective negotiators understand that negotiation is not a zero-sum game. In a zero-sum game, one party's gain is the other party's loss. But in most negotiations, it is possible to find solutions that benefit both parties—what is called a win-win outcome. This requires creativity, empathy, and a willingness to understand the other party's needs.

Preparation is essential for successful negotiation. Before entering a negotiation, you should understand your own interests and priorities, as well as the other party's. You should also know your alternatives—what will you do if the negotiation fails? The stronger your alternatives, the more leverage you have.

Communication is another critical factor. Good negotiators are active listeners, paying attention not only to what is said but also to what is not said. They ask questions to clarify the other party's interests and concerns. They communicate clearly and respectfully, avoiding aggressive or defensive language.

Emotional intelligence is also important. Negotiations can be stressful, and emotions can run high. Skilled negotiators manage their own emotions and recognize the emotions of others. They stay calm under pressure and avoid making decisions based on anger or fear.

Finally, flexibility is key. Negotiations rarely go exactly as planned. Skilled negotiators are willing to adapt their strategies as new information emerges. They are also willing to walk away if the deal is not in their best interest.

In the end, negotiation is not about winning or losing. It is about finding solutions that work for everyone.`,

    reading:{
  title:'Data-Driven Decision Making',

  minutes: 5,
  text:`In today's business world, data is everywhere. Companies collect vast amounts of information about their customers, their operations, and their markets. But data alone is not enough. What matters is how we use data to make better decisions. This is the essence of data-driven decision making.

Data-driven decision making is the process of using data to inform business decisions. Instead of relying on intuition or guesswork, decision-makers analyze data to identify patterns, trends, and insights. This approach can lead to better outcomes, reduced risks, and increased efficiency.

The first step in data-driven decision making is defining the problem. What question are we trying to answer? What decision are we trying to make? Without a clear question, data analysis can be unfocused and ineffective.

The next step is collecting and analyzing data. This may involve gathering data from internal sources, such as sales records and customer databases, or external sources, such as market research and industry reports. Analysts use statistical tools and techniques to identify patterns and relationships in the data.

Once the data has been analyzed, the next step is interpreting the results. This is where human judgment comes in. Data can tell us what has happened, but it cannot tell us what to do. Decision-makers must interpret the data in the context of their business goals, their values, and their understanding of the market.

Finally, the decision must be implemented and evaluated. The results should be monitored to see if the decision achieved its intended outcome. If not, the decision may need to be revised.

Data-driven decision making is not a guarantee of success. Data can be incomplete, biased, or misinterpreted. But when used carefully, it can significantly improve the quality of decisions.

In the end, data is a tool, not a solution. Its value depends on how it is used.`,
